<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>Inside one Job: power first, then run, check, compare and propose</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="60.0" y="78.4" font-size="42" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">Inside one Job: power first, then run, check, compare and</text>
<text x="60.0" y="128.8" font-size="42" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">propose</text>
<text x="60.0" y="183.7" font-size="23" fill="#3f3f46" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">•</text>
<text x="83.0" y="183.7" font-size="23" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="start">Power is checked before any outcome is read, so a weak cut is refused and shown, never run.</text>
<text x="60.0" y="223.6" font-size="23" fill="#3f3f46" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">•</text>
<text x="83.0" y="223.6" font-size="23" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="start">Each partition is its own hard Run; Cross runs one test of the difference.</text>
<text x="60.0" y="263.5" font-size="23" fill="#3f3f46" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">•</text>
<text x="83.0" y="263.5" font-size="23" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="start">Compare and propose come after the checks, so a proposal rests on checked answers.</text>
<rect x="60.0" y="415.2" width="136.6" height="160.0" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6,4"/>
