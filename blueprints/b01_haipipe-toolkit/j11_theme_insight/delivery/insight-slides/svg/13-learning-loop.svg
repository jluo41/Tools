<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>Comparing Jobs is how the questions grow</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="60.0" y="78.4" font-size="42" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">Comparing Jobs is how the questions grow</text>
<text x="60.0" y="133.3" font-size="23" fill="#3f3f46" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">•</text>
<text x="83.0" y="133.3" font-size="23" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="start">Gaps and changed answers become proposals; proposals become the next release.</text>
<text x="60.0" y="173.2" font-size="23" fill="#3f3f46" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="start">•</text>
<text x="83.0" y="173.2" font-size="23" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="start">A question added after seeing the data stays exploratory until the next data version confirms it.</text>
<rect x="60.0" y="351.1" width="204.8" height="108.0" rx="3" fill="none" stroke="#1f5aa8" stroke-width="1.5"/>
<text x="162.4" y="391.1" font-size="22" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="middle">Job closes</text>
<text x="162.4" y="428.5" font-size="18" fill="#3f3f46" font-weight="normal" font-family="'Times New Roman', Times, serif" text-anchor="middle">frozen</text>
