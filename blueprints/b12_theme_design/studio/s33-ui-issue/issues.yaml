works_well:
- "The goal × method Map: one row, a column per registered method, each Job with its version, inputs and state; one glance shows the input ladder."
- "The design card read three ways side by side: the SMS on a phone with {LINK} in place, each element with its source, the review and expected range."
- "Review whole as one plain table (rank · design · predicted · why · kept) with the reviewer's real reasoning."
- "The Inputs fence table: each part of step ①, its file and sha, and 'nothing' where a method sees nothing; the M01–M04 ladder is easy to compare."
- "The method view as its five numbered steps, pinned with the method's sha."
- "One casing for the Job's views (Reason ideas · Conduct & review · Review whole) across Audience Report, Work Details and Runs."
- "The Task ▾ menu grouped by step (② · ③ · ⑤), dropped designs marked; each Task tab says 'Task · d04 · name'."
- "t00 › Work Details › Chains as a flush table (topic · step · says · so · from)."
- "The same six Spaces at every level with the Disk · Runs panel beside them; the Runs panel names the skill even on an empty type."
- "Every frame-to-frame link (Spaces, views, Job and Task menus, design links) returned 200 and stayed in the frame."
