<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML report layout</title>
<style>
:root{--line:#e3e3e6;--muted:#8a8a86;--ink:#1c1c1c;--bg:#fff;--ok:#2b8a3e;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root{--line:#2c2e33;--muted:#8e8e8a;--ink:#e8e8e6;--bg:#161719;--ok:#69db7c;--bad:#ff8787}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:24px}
h1{font-size:20px;margin:0 0 4px}.file{color:var(--muted);font:12px ui-monospace,Menlo,monospace;margin:0 0 18px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}td.mk{width:24px;text-align:center}
.bad{color:var(--bad)}.ok{color:var(--ok)}
</style></head><body><main>
<h1>example.csv</h1><p class="file">120 rows · 6 columns</p>
<table>
<tr><th></th><th>Check</th><th>Where</th></tr>
<tr><td class="mk ok">✓</td><td>Columns match their names and types</td><td></td></tr>
<tr><td class="mk bad">✗</td><td><b>date</b> reads as text</td><td>rows 41, 87</td></tr>
<tr><td class="mk ok">✓</td><td>Numbers inside their ranges</td><td></td></tr>
<tr><td class="mk bad">✗</td><td><b>age</b> is empty</td><td>row 12</td></tr>
</table>
</main></body></html>
