<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio cards</title>
<style>
:root{--bg:#f6f5f1;--card:#fffefb;--fg:#1b2433;--mut:#5d6675;--line:#e6e3db;--acc:#2f6feb;--acc-bg:#e8effd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--card:#1c1e22;--fg:#e8e6e1;--mut:#9aa3b2;--line:#30333a;--acc:#6b9bff;--acc-bg:#1f2b45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
main{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.top{font-size:15px;color:var(--mut);margin-bottom:6px}.top b{color:var(--fg)}.top .mock{float:right;font-size:13px;color:#a15c07}
h1{font-size:28px;margin:0 0 16px}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.groups button{font:inherit;font-size:14px;padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.groups button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.groups button i{font-style:normal;color:var(--mut);margin-left:6px}.groups button.on i{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(20,30,50,.10);transform:translateY(-2px)}
.pic{display:block;height:190px;background:#fff;border-bottom:1px solid var(--line);cursor:zoom-in;overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.pic.none{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;background:var(--acc-bg);cursor:pointer}
.body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.topic{color:var(--mut);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.stage{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stage i{width:8px;height:8px;border-radius:50%;display:inline-block}
.opens{margin-left:auto;display:flex;gap:6px}
.opens button{font:inherit;font-size:13px;font-weight:600;padding:4px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--acc);cursor:pointer}
.opens button:hover{background:var(--acc-bg)}
dialog{width:min(1400px,94vw);height:90vh;padding:0;border:none;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.35);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(20,24,32,.45)}
.dh{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}
.dh a{margin-left:auto;font-weight:500;font-size:14px;color:var(--acc)}.dh button{font-size:20px;border:none;background:none;color:var(--mut);cursor:pointer}
dialog iframe{width:100%;height:calc(100% - 50px);border:0;background:#fff}
</style></head><body><main>
<div class="top">Knowledge-SPACE › Tools › blueprints › <b>b10_project_workbench</b><span class="mock">mock · s33 · studio cards</span></div>
<h1>Studio</h1>
<div class="groups" id="groups"></div>
<div class="grid" id="grid"></div>
</main>
<dialog id="pop"><div class="dh"><span id="ptitle"></span><a id="ptab" target="_blank" rel="noopener">Open in its own tab ↗</a><button onclick="pop.close()" aria-label="Close">×</button></div><iframe id="pframe" title="pop-out"></iframe></dialog>
<script>
const CARDS=[{"name": "s00-overview", "topic": "what this Block stands on, for a reader new to it, and an index of its studio topics (sNN), Jobs (jNN) and Questions (qNN) with how far …", "tags": ["Structure"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s00-overview/s00-overview.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s00-overview/s00-overview.excalidraw", "map": ""}, {"name": "s01-overall-tree-structure", "topic": "one tree from Space down to Run (Space → Project → Theme → Block → Job → Task → Run), each level with its specials, its variants, its …", "tags": ["Structure"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s01-overall-tree-structure/s01-overall-tree-structure.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s01-overall-tree-structure/s01-overall-tree-structure.excalidraw", "map": ""}, {"name": "s02-studio-workbench-skill", "topic": "the Studio seen from both sides: its workbench (the Studio view that Block, Job and Task open, in the shared frame `servers/workbench`) and …", "tags": ["UI", "Structure"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s02-studio-workbench-skill/s02-studio-workbench-skill.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s02-studio-workbench-skill/s02-studio-workbench-skill.excalidraw", "map": ""}, {"name": "s03-delivery-workbench-skill", "topic": "the Delivery seen from both sides: its workbench (the Delivery view at the right end of the top row, Studio | Block · Job · Task | …", "tags": ["Structure", "UI"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s03-delivery-workbench-skill/s03-delivery-workbench-skill.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s03-delivery-workbench-skill/s03-delivery-workbench-skill.excalidraw", "map": ""}, {"name": "s04-related-workbench-skill", "topic": "the Related seen from both sides: its workbench (the Studio's second folding part, under the topic cards, since 261011; was Description › …", "tags": ["Structure", "UI"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s04-related-workbench-skill/s04-related-workbench-skill.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s04-related-workbench-skill/s04-related-workbench-skill.excalidraw", "map": ""}, {"name": "s05-report-workbench-skill", "topic": "the Report seen from both sides: what a report is and how a level answers its Questions, its workbench (the Report Space on Block, Job and …", "tags": ["Structure", "Report", "UI"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s05-report-workbench-skill/s05-report-workbench-skill.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s05-report-workbench-skill/s05-report-workbench-skill.excalidraw", "map": ""}, {"name": "s06-run-workbench-skill", "topic": "the Run seen from both sides: what a Run is and what it does, its workbench (the Runs panel beside every Space, the Runs Space on every …", "tags": ["Structure", "Run and Skill"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s06-run-workbench-skill/s06-run-workbench-skill.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s06-run-workbench-skill/s06-run-workbench-skill.excalidraw", "map": ""}, {"name": "s08-studio-timeline", "topic": "the Studio's fourth folding part, Timeline, under the topic cards, Related and Delivery (s03-D09): what moved in this Block's Studio and …", "tags": ["UI", "Structure"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s08-studio-timeline/s08-studio-timeline.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s08-studio-timeline/s08-studio-timeline.excalidraw", "map": ""}, {"name": "s09-block-folder", "topic": "the Studio's fifth folding part, Folder, under the topic cards, Related, Delivery and Timeline: the Block's own folder as a tree, so a …", "tags": ["UI", "Structure"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s09-block-folder/s09-block-folder.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s09-block-folder/s09-block-folder.excalidraw", "map": ""}, {"name": "s10-haipipe-project", "topic": "what the haipipe-project skill is and does. It owns a Project's root (README.md, project.yaml, which Theme folders exist and which skill …", "tags": ["Structure", "Run and Skill"], "stage": "explore", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s10-haipipe-project/s10-haipipe-project.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s10-haipipe-project/s10-haipipe-project.excalidraw", "map": ""}, {"name": "s31-guide", "topic": "the Guide tab of the frame: the family's docs, the same in every Block. Its four Views (Description · Method · RoadMap Draw · Related …", "tags": ["Guide"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s31-guide/s31-guide.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s31-guide/s31-guide.excalidraw", "map": ""}, {"name": "s32-element-ui", "topic": "every kind of element a workbench draws, as each workbench draws it today, side by side, so one look per element can be picked and the base …", "tags": ["UI"], "stage": "shaping", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s32-element-ui/s32-element-ui.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s32-element-ui/s32-element-ui.excalidraw", "map": ""}, {"name": "s33-one-page-shape", "topic": "one page shape for every level of the work workbench: answer line, a table of rows, the next step, details folded last. A Block's rows are …", "tags": ["UI"], "stage": "explore", "png": "", "draw": "", "map": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s33-one-page-shape/s33-one-page-shape.mindmap.html"}, {"name": "s51-server-runtime", "topic": "how the workbench server runs today: how it starts, which folders make it up, how one request finds its page, how the base frame draws a …", "tags": ["Server"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s51-server-runtime/s51-server-runtime.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s51-server-runtime/s51-server-runtime.excalidraw", "map": ""}, {"name": "s52-host-and-share", "topic": "how a Block is shared with colleagues: who may open it, how they prove who they are (their JHU JHED sign-in), what they see and never see, …", "tags": ["Server"], "stage": "closed", "png": "http://100.121.165.84:5623/blueprints/Project-Ladder/work/b10_project_workbench/studio/s52-host-and-share/s52-host-and-share.png", "draw": "http://100.121.165.84:5623/_excalidraw/?board=blueprints/Project-Ladder/work/b10_project_workbench/studio/s52-host-and-share/s52-host-and-share.excalidraw", "map": ""}];
const STAGE={explore:"#9aa3b2",shaping:"#e0a33a",agreed:"#2f6feb",closed:"#16794a"};
const pop=document.getElementById("pop");
function open_(title,url){document.getElementById("ptitle").textContent=title;document.getElementById("pframe").src=url;document.getElementById("ptab").href=url;pop.showModal()}
pop.addEventListener("close",()=>document.getElementById("pframe").src="about:blank");
pop.addEventListener("click",e=>{if(e.target===pop)pop.close()});
let picked="All";
function render(){
  const groups={};CARDS.forEach(c=>c.tags.forEach(t=>groups[t]=(groups[t]||0)+1));
  const names=["All",...Object.keys(groups)];
  document.getElementById("groups").innerHTML=names.map(g=>`<button class="${g===picked?'on':''}" data-g="${g}">${g}<i>${g==="All"?CARDS.length:groups[g]}</i></button>`).join("");
  document.querySelectorAll("#groups button").forEach(b=>b.onclick=()=>{picked=b.dataset.g;render()});
  const shown=CARDS.filter(c=>picked==="All"||c.tags.includes(picked));
  document.getElementById("grid").innerHTML=shown.map((c,i)=>{
    const first=c.draw?["Drawing",c.draw]:(c.map?["Mind map",c.map]:null);
    const pic=c.png?`<a class="pic" data-i="${CARDS.indexOf(c)}" data-k="draw"><img loading="lazy" src="${c.png}" alt="${c.name}"></a>`
                   :`<a class="pic none" data-i="${CARDS.indexOf(c)}" data-k="${first&&first[0]==='Mind map'?'map':'draw'}">${first?first[0]+' only':'No drawing yet'}</a>`;
    const btns=(c.draw?`<button data-i="${CARDS.indexOf(c)}" data-k="draw">Drawing</button>`:"")+(c.map?`<button data-i="${CARDS.indexOf(c)}" data-k="map">Mind map</button>`:"");
    return `<div class="card">${pic}<div class="body"><div class="name">${c.name}</div><div class="topic">${c.topic}</div>
      <div class="foot"><span class="stage"><i style="background:${STAGE[c.stage]||'#ccc'}"></i>${c.stage||'no stage'}</span><span class="opens">${btns}</span></div></div></div>`}).join("");
  document.querySelectorAll("#grid [data-k]").forEach(el=>el.onclick=()=>{const c=CARDS[+el.dataset.i],k=el.dataset.k;
    open_(c.name+(k==="map"?" · mind map":" · drawing"), k==="map"?c.map:c.draw)});
}
render();
</script></body></html>
