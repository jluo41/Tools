<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview · interactive</title>
<style>:root{color-scheme:light dark}body{margin:0;padding:18px;background:light-dark(#fff,#20252d)}.cursor-interaction{cursor:pointer}button:focus-visible{outline:2px solid #6ba5ef;outline-offset:3px}</style></head><body>
<style>
#s11-overview-demo{--ov-paper:light-dark(#fff,#20252d);--ov-ink:light-dark(#242b35,#e7edf5);--ov-muted:light-dark(#717a88,#a5b0c0);--ov-line:light-dark(#e2e7ed,#3b4655);--ov-blue:light-dark(#1767ce,#90bbff);--ov-soft:light-dark(#edf4ff,#2a3d57);color:var(--ov-ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative}
#s11-overview-demo *{box-sizing:border-box}
#s11-overview-demo [hidden]{display:none!important}
#s11-overview-demo button{font:inherit;color:inherit}
#s11-overview-demo .ov-product{background:var(--ov-paper);border:1px solid var(--ov-line);border-radius:10px;padding:24px;position:relative}
#s11-overview-demo .ov-context{color:var(--ov-muted);font-size:12px;margin:0 100px 10px 0}
#s11-overview-demo h2{font-size:23px;line-height:1.4;font-weight:600;margin:0 0 20px}
#s11-overview-demo .ov-main{display:inline-block;color:var(--ov-blue);border-bottom:2px solid var(--ov-blue);padding-bottom:8px;margin-bottom:18px}
#s11-overview-demo .ov-heading{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ov-line);padding:12px 0}
#s11-overview-demo .ov-fold{flex:1;text-align:left;border:0;background:none;padding:0;font-weight:600;font-size:17px}
#s11-overview-demo .ov-fold span{display:inline-block;width:22px;color:var(--ov-muted)}
#s11-overview-demo .ov-dot{border:0;background:none;padding:10px;display:grid;place-items:center;border-radius:50%;width:32px;height:32px}
#s11-overview-demo .ov-dot:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--ov-blue)}
#s11-overview-demo .ov-dot:hover{background:var(--ov-soft)}
#s11-overview-demo .ov-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:18px 0 22px}
#s11-overview-demo .ov-tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--ov-muted)}
#s11-overview-demo .ov-tabs button[aria-pressed=true]{border-color:var(--ov-line);background:var(--ov-soft);color:var(--ov-blue);font-weight:600}
#s11-overview-demo .ov-content{min-height:295px;position:relative}
#s11-overview-demo .ov-goal{font-size:23px;line-height:1.65;letter-spacing:-.3px;max-width:740px;margin:0;padding:22px 2px}
#s11-overview-demo .ov-requirement{padding:22px 2px;max-width:700px}
#s11-overview-demo h3{font-size:15px;font-weight:600;margin:0 0 12px}
#s11-overview-demo .ov-requirement p{font-size:20px;margin:0;line-height:1.65}
#s11-overview-demo .ov-layout{display:grid;grid-template-columns:145px minmax(0,1fr);gap:22px}
#s11-overview-demo .ov-layout.no-list{grid-template-columns:1fr}
#s11-overview-demo .ov-side{border-right:1px solid var(--ov-line);padding-right:12px}
#s11-overview-demo .ov-side button{display:block;text-align:left;width:100%;padding:8px 9px;border:0;border-radius:6px;background:none;margin-bottom:4px}
#s11-overview-demo .ov-side button[aria-pressed=true]{background:var(--ov-soft);color:var(--ov-blue);font-weight:600}
#s11-overview-demo .ov-map-toolbar{margin-top:-10px;margin-bottom:4px}
#s11-overview-demo .ov-map{display:flex;flex-direction:column;align-items:center;gap:22px;padding:2px 0 18px}
#s11-overview-demo .ov-root{padding:8px 16px;border:1px solid var(--ov-line);border-radius:6px;position:relative}
#s11-overview-demo .ov-root:after{content:'';position:absolute;left:50%;top:100%;height:22px;border-left:1px solid var(--ov-line)}
#s11-overview-demo .ov-groups{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;position:relative}
#s11-overview-demo .ov-groups:before{content:'';position:absolute;left:24%;right:24%;top:0;border-top:1px solid var(--ov-line)}
#s11-overview-demo .ov-branch{display:flex;flex-direction:column;align-items:stretch;gap:9px;position:relative;padding-top:18px}
#s11-overview-demo .ov-branch:before{content:'';position:absolute;left:50%;top:0;height:18px;border-left:1px solid var(--ov-line)}
#s11-overview-demo .ov-group{padding:7px 9px;text-align:center;background:var(--ov-soft);border-radius:6px;margin-bottom:6px;color:var(--ov-blue)}
#s11-overview-demo .ov-node{padding:8px 10px;text-align:left;border:1px solid var(--ov-line);border-radius:6px;background:var(--ov-paper);position:relative}
#s11-overview-demo .ov-node:hover{border-color:var(--ov-blue);color:var(--ov-blue)}
#s11-overview-demo .ov-structure button{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 0;text-align:left;background:none;border:0;border-bottom:1px solid var(--ov-line)}
#s11-overview-demo .ov-structure span{color:var(--ov-muted);font-size:13px}
#s11-overview-demo .ov-inspect{position:absolute;inset:0;z-index:3;background:var(--ov-paper);border:1px solid var(--ov-line);border-radius:10px;padding:26px;box-shadow:0 8px 30px #0002}
#s11-overview-demo .ov-inspect p{font-size:19px;line-height:1.6;margin:20px 0}
#s11-overview-demo .ov-inspect code{display:block;color:var(--ov-muted);overflow-wrap:anywhere;font-size:12px;margin-top:24px}
#s11-overview-demo .ov-close{float:right;border:1px solid var(--ov-line);background:none;padding:5px 12px;border-radius:6px;margin:0 0 12px 12px}
#s11-overview-demo .ov-product.expanded .ov-context,#s11-overview-demo .ov-product.expanded .ov-title,#s11-overview-demo .ov-product.expanded .ov-main{display:none}
#s11-overview-demo .ov-product.expanded .ov-content{min-height:420px}
@media(max-width:540px){#s11-overview-demo .ov-product{padding:16px}#s11-overview-demo .ov-layout{grid-template-columns:1fr;gap:16px}#s11-overview-demo .ov-side{border-right:0;border-bottom:1px solid var(--ov-line);padding:0 0 10px;display:flex;gap:8px}#s11-overview-demo .ov-side button{width:auto}#s11-overview-demo .ov-goal{font-size:20px}#s11-overview-demo .ov-groups{gap:12px}#s11-overview-demo .ov-node{font-size:12px;padding:8px}#s11-overview-demo .ov-group{font-size:12px}}
@media(pointer:coarse){#s11-overview-demo button{min-height:44px}#s11-overview-demo .ov-dot{min-width:44px}}
</style>
<div id="s11-overview-demo">
<section class="ov-product" aria-label="Job Overview proposal">
<h2 class="ov-title">j11 · Core checks</h2><div class="ov-main">Main</div>
<div class="ov-heading"><button class="ov-fold cursor-interaction" aria-expanded="true"><span>⌄</span>Overview</button><button class="ov-dot ov-expand cursor-interaction" aria-label="Expand Overview" data-tooltip="Expand Overview" aria-pressed="false"></button></div>
<div class="ov-body">
<nav class="ov-tabs" aria-label="Overview views"><button class="cursor-interaction" data-view="goal" aria-pressed="true">Goal</button><button class="cursor-interaction" data-view="requirements" aria-pressed="false">Requirements</button><button class="cursor-interaction" data-view="mindmap" aria-pressed="false">MindMap</button></nav>
<div class="ov-content">
<section data-panel="goal"><p class="ov-goal">The checks a CSV must pass: its columns, its value ranges, its missing values, and the reports that show them.</p></section>
<section data-panel="requirements" hidden><div class="ov-requirement"><h3>Close</h3><p>Every check runs on the example file and both reports show its results.</p></div></section>
<section data-panel="mindmap" hidden>
<div class="ov-map-toolbar"><button class="ov-dot ov-toggle cursor-interaction" aria-label="Hide navigation" data-tooltip="Hide navigation" aria-expanded="true"></button></div>
<div class="ov-layout"><nav class="ov-side" aria-label="MindMap content"><button class="cursor-interaction" data-map="topics" aria-pressed="true">Topics</button><button class="cursor-interaction" data-map="structure" aria-pressed="false">Work Structure</button></nav><div>
<div class="ov-map" data-map-panel="topics" aria-label="Core checks task groups">
<div class="ov-root">j11 · Core checks</div><div class="ov-groups"><div class="ov-branch"><div class="ov-group">Task Group 1</div><button class="ov-node cursor-interaction" data-task="0">t01 · Columns</button><button class="ov-node cursor-interaction" data-task="1">t02 · Value ranges</button><button class="ov-node cursor-interaction" data-task="2">t03 · Missing values</button></div><div class="ov-branch"><div class="ov-group">Task Group 2</div><button class="ov-node cursor-interaction" data-task="3">t11 · Text report</button><button class="ov-node cursor-interaction" data-task="4">t12 · HTML report</button></div></div>
</div><div class="ov-structure" data-map-panel="structure" hidden></div>
</div></div></section>
</div></div>
<section class="ov-inspect" role="dialog" aria-label="Task detail" hidden><button class="ov-close cursor-interaction">Close</button><h2 class="ov-task-title"></h2><p class="ov-task-goal"></p><code class="ov-task-path"></code></section>
</section></div>
<script>
(()=>{
const root=document.getElementById('s11-overview-demo');
const q=s=>root.querySelector(s),all=s=>root.querySelectorAll(s);
const tasks=[['t01 · Columns','Each column is the name and type the file says.','t01_schema_check'],['t02 · Value ranges','Each number is inside its allowed range.','t02_value_ranges'],['t03 · Missing values','Each empty cell is found and counted.','t03_missing_values'],['t11 · Text report','The results as plain text.','t11_text_report'],['t12 · HTML report','The results as one HTML page.','t12_html_report']];
let state={view:'goal',map:'topics',list:true,fold:true,expanded:false,task:null},lastFocus=null;
tasks.forEach((t,i)=>{const b=document.createElement('button');b.className='cursor-interaction';b.dataset.task=i;const a=document.createElement('strong'),s=document.createElement('span');a.textContent=t[0];s.textContent=t[1];b.append(a,s);q('.ov-structure').append(b)});
function render(){
 all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));all('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==state.view);
 all('[data-map]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.map===state.map));all('[data-map-panel]').forEach(p=>p.hidden=p.dataset.mapPanel!==state.map);
 q('.ov-side').hidden=!state.list;q('.ov-layout').classList.toggle('no-list',!state.list);q('.ov-toggle').setAttribute('aria-expanded',state.list);
 const label=state.list?'Hide navigation':'Show navigation';q('.ov-toggle').setAttribute('aria-label',label);q('.ov-toggle').dataset.tooltip=label;
 q('.ov-body').hidden=!state.fold;q('.ov-fold').setAttribute('aria-expanded',state.fold);q('.ov-fold span').textContent=state.fold?'⌄':'›';
 q('.ov-product').classList.toggle('expanded',state.expanded);q('.ov-expand').setAttribute('aria-pressed',state.expanded);q('.ov-expand').dataset.tooltip=state.expanded?'Restore Overview':'Expand Overview';q('.ov-expand').setAttribute('aria-label',q('.ov-expand').dataset.tooltip);
 all('[data-tooltip]').forEach(b=>b.title=b.dataset.tooltip);
 q('.ov-inspect').hidden=state.task===null;
 if(state.task!==null){const t=tasks[state.task];q('.ov-task-title').textContent=t[0];q('.ov-task-goal').textContent=t[1];q('.ov-task-path').textContent='blueprints/Project-Ladder/work/b01_example_work/j11_core_checks/'+t[2]+'/'}
}
function save(){}
function close(){state.task=null;render();lastFocus?.focus();save()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view)state.view=b.dataset.view;
 if(b.dataset.map)state.map=b.dataset.map;
 if(b.classList.contains('ov-toggle'))state.list=!state.list;
 if(b.classList.contains('ov-fold'))state.fold=!state.fold;
 if(b.classList.contains('ov-expand')){state.expanded=!state.expanded;state.fold=true}
 if(b.classList.contains('ov-close')){close();return}
 if(b.dataset.task!==undefined){state.task=Number(b.dataset.task);lastFocus=b}
 render();if(b.dataset.task!==undefined)q('.ov-close').focus();save();
});
root.addEventListener('keydown',e=>{if(state.task!==null){if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){e.preventDefault();q('.ov-close').focus()}}else if(e.key==='Escape'&&state.expanded){state.expanded=false;render();save()}});
render();
})();
</script>

</body></html>
