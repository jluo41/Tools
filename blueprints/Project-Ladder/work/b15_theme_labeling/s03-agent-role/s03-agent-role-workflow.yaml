legend:
  main: 'Solid blue: main handoff'
  feedback: 'Dashed purple: revision / return'
  evidence: 'Dotted gray: supporting detail'
  human: 'Green: human judgment / acceptance'
footer: 'One human judgment can guide many items. This is the proposed workflow; reduced effort, model parity and cost savings still require evaluation.'
