  wording_loop: 'Expression loop · rewrite and retest on development cases'
  semantic_return: 'Meaning changed or ambiguous? Return to human judgment at 04'
  audit_return: 'New boundary or contradiction → package the next question at 03'
  release: 'versioned handoff'
