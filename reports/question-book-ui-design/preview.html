</script><script>const B=window.BOOK;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=(level,id,view)=>`#${level}/${id}/${view}`;
const link=(level,id,view,text)=>`<a href="${href(level,id,view)}">${esc(text)}</a>`;
const pill=s=>`<span class="pill ${s==='沿用'?'kept':/待|草稿|等待|未/.test(s)?'pending':''}">${esc(s)}</span>`;
const source=id=>`<button class="textbutton" data-source="${esc(id)}">${esc(B.sources[id]?.name||id)} ↗</button>`;
const section=(name,body)=>`<section class="section"><h2>${esc(name)}</h2>${body}</section>`;
let route;
function parse(){let [level,id,view]=location.hash.slice(1).split('/');if(!['block','job','task'].includes(level))return {level:'job',id:'v2',view:'plan'};if(level==='job'&&!B.versions[id])id='v2';if(level==='task'&&!B.questions[id])id='K02';return {level,id:level==='block'?'book':id,view:view||'overview'};}
function scopeFindings(level,id){return Object.values(B.findings).filter(f=>level==='block'||(level==='job'?f.version===id:f.owner===id));}
function findingCard(f){const owner=B.questions[f.owner];return `<article class="finding"><div class="row-head"><h3>${esc(f.title)}</h3>${pill(f.state)}</div><div class="origin">${esc(f.id)} · ${esc(f.version)} · 来源：${owner?link('task',owner.id,'findings',owner.id+' '+owner.title):link('job',f.version,'findings','版本整体发现')}</div><p>${esc(f.body)}</p><div class="actions"><button class="textbutton" data-finding="${f.id}">查看依据与影响</button></div></article>`;}
function findings(level,id){const fs=scopeFindings(level,id);return section('Findings',fs.length?fs.map(findingCard).join(''):`<div class="paper">这一范围尚未记录发现。${level==='job'?link('job','v2','findings','查看第二版的发现'):''}</div>`);}
function fold(title,state,body){return `<details class="fold"><summary><span class="summary-title">${esc(title)}</span>${pill(state)}</summary><div class="fold-body">${body}</div></details>`;}
function questionRows(ids,version){return ids.map(id=>{const q=B.questions[id];const changed=q.owner===version;return `<div class="row"><div class="row-head"><div><span class="muted">${esc(q.level)} · ${q.id}</span><br>${link('task',id,'question',q.title)}</div>${pill(changed?'新增':'沿用')}</div><div class="source-line">定义归属：${esc(q.owner)}${changed?'':' · 此处引用原 Task'}</div></div>`;}).join('');}
function overview(level,id){if(level==='block')return section('研究目标',`<div class="paper"><p>${esc(B.goal)}</p><div class="actions">${link('job','v2','plan','继续第二版工作')}${link('block','book','questions','查看问题集')}</div></div>`)+section('版本演进',`<div class="relation"><a class="node" href="#job/v1/overview"><strong>第一版</strong>建立基础问题</a><span>→</span><a class="node" href="#job/v2/overview"><strong>第二版</strong>补齐时间稳定性</a></div>`);
 const v=B.versions[id];return section('为什么升级',`<div class="paper"><p>${esc(v.motivation)}</p>${id==='v2'?source('proposal'):''}</div>`)+section('这一版要达到什么',`<div class="paper"><p>${esc(v.goal)}</p><p class="muted">Question Book 交付可复用的问题与方法；不会在这里预先确定数据上的答案。</p>${id!=='v1'?`<div class="actions">${link('job',id,'plan','查看计划与结果')}<button class="textbutton" data-compare="${id}">对照上一版</button></div>`:''}</div>`)+section('范围',`<div class="paper">${questionRows(v.questionIds,id)}</div>`);}
function plan(level,id){if(level==='block')return `<div class="toolbar"><h2>Plan + Results</h2><button id="draft-version">起草下一版</button></div>`+Object.entries(B.versions).map(([vid,v])=>fold(v.name,v.state,`<div class="pair"><div><div class="label">计划</div><p>${esc(v.goal)}</p></div><div><div class="label">结果与进度</div><p>${vid==='v1'?'基础版本已冻结；后续版本通过引用沿用问题。':vid==='v2'?'K02 已起草，证据计划待审查；尚未发布。':'已建立草稿范围，尚未开始问题修订。'}</p></div></div><div class="actions">${link('job',vid,'plan','进入版本工作台')}${link('job',vid,'findings','查看本版发现')}</div>`)).join('');
 if(level==='task'){const q=B.questions[id];return section('Plan + Results',q.steps.map(s=>fold(s.title,s.state,`<div class="pair"><div><div class="label">预期</div><p>${esc(s.expected)}</p></div><div><div class="label">结果</div><p>${esc(s.result)}</p></div></div><div class="actions">${source(q.source)}${link('task',id,'method','查看证据与方法')}</div>`)).join(''))+section('来自版本计划',`<div class="paper">${link('job','v2','plan',id==='K02'?'补齐跨时间的差异检验':'沿用每日变化问题')}</div>`);}
 const items=B.plans.filter(p=>p.version===id);return section('Plan + Results',items.length?items.map(p=>fold(p.title,p.state,`<p class="muted" style="margin-top:16px">${esc(p.why)}</p><div class="pair"><div><div class="label">计划与完成标准</div><p>${esc(p.expected)}</p></div><div><div class="label">结果与进度</div><p>${esc(p.result)}</p></div></div><div class="actions">${p.question?link('task',p.question,'plan','进入 '+p.question):`<button class="textbutton" data-review="${id}">查看发布条件</button>`}${p.findingIds.map(fid=>`<button class="textbutton" data-finding="${fid}">发现 · ${esc(B.findings[fid].title)}</button>`).join('')}</div>`)).join(''):`<div class="paper">${id==='v1'?'原型未展开第一版的历史工作记录。':'下一版草稿已保留问题引用；具体改进计划尚未填写。'}</div>`)+ (id==='v1'?'':`<div class="gate"><button disabled>确认发布</button><p>${id==='v2'?'K02 证据计划、脚本及整版审查未完成，不能发布。':'草稿尚未审查，不能发布。'} <button class="textbutton" data-review="${id}">查看条件</button></p></div>`);}
function questions(level,id){const version=level==='job'?id:$('#version-select')?.value||'v2';const v=B.versions[version];return `<div class="toolbar"><h2>Questions</h2>${level==='block'?`<label>版本 <select id="version-select">${Object.keys(B.versions).map(k=>`<option ${k===version?'selected':''}>${k}</option>`).join('')}</select></label>`:`<button class="textbutton" data-compare="${id}">查看版本变化</button>`}</div><div class="paper">${questionRows(v.questionIds,version)}</div><p class="muted">原型聚焦 I02 与 K02。${source('release')}</p>`+section('问题关系',`<div class="relation"><a class="node" href="#task/I02/question"><strong>I02 · 描述</strong>每日结果怎样变化</a><span>提供背景证据 →</span><a class="node" href="#task/K02/method"><strong>K02 · 检验</strong>组间差异是否随时间改变</a></div>`);}
function taskQuestion(id){const q=B.questions[id];return section('问题定义',`<div class="paper"><p><strong>${esc(q.title)}</strong></p><p>${esc(q.goal)}</p>${source(q.source)}</div>`)+section('为什么需要这个问题',`<div class="paper"><p>${esc(q.why)}</p><div class="actions">${link('job','v2','overview','回到版本动机')}</div></div>`)+section('版本归属',`<div class="paper">${esc(q.id)} 的定义保存在 ${esc(q.owner)}。${q.owner==='v1'?'第二版引用同一份定义，旧版本保持不变。':'当前仍在准备与审查阶段。'}</div>`);}
function method(id){const q=B.questions[id];return section('回答方法',`<div class="paper"><p>${esc(q.method)}</p></div>`)+section('需要的证据',`<div class="paper"><ul>${q.needs.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>${source(q.source)}</div>`)+section('预期交付',`<div class="paper">${esc(q.output)}</div>`);}
function ideas(){return section('Ideas',`<div class="paper">${B.ideas.map(i=>`<div class="row"><div class="row-head"><strong>${esc(i.title)}</strong>${pill(i.state)}</div><p>${esc(i.why)}</p><div class="actions">${i.target?link('task',i.target,'question','查看对应问题'):''}${i.source?source(i.source):''}</div></div>`).join('')}</div>`);}
function render(){route=parse();const {level,id}=route;const tabs=level==='block'?[['overview','Overview'],['questions','Questions'],['ideas','Ideas'],['plan','Plan + Results'],['findings','Findings']]:level==='job'?[['overview','Overview'],['questions','Questions'],['plan','Plan + Results'],['findings','Findings']]:[['question','Question'],['method','Method'],['plan','Plan + Results'],['findings','Findings']];if(!tabs.some(t=>t[0]===route.view))route.view=tabs[0][0];const view=route.view;
 $('#levels').innerHTML=`<div class="navgroup">问题集</div><a class="${level==='block'?'active':''}" href="#block/book/overview">组间差异</a><div class="navgroup">版本</div>${Object.entries(B.versions).map(([k,v])=>`<a class="${level==='job'&&id===k?'active':''}" href="#job/${k}/plan">${esc(v.name)}</a>`).join('')}<div class="navgroup">具体问题</div>${Object.values(B.questions).map(q=>`<a class="${level==='task'&&id===q.id?'active':''}" href="#task/${q.id}/question">${q.id} · ${q.id==='I02'?'每日变化':'时间稳定性'}</a>`).join('')}`;
 $('#crumb').innerHTML=link('block','book','overview','Question Book')+(level!=='block'?`<span>/</span>${link('job',level==='job'?id:B.questions[id].owner,'overview',level==='job'?id:B.questions[id].owner)}`:'')+(level==='task'?`<span>/</span><span>${id}</span>`:'');
 $('#level-name').textContent={block:'Block · 整本问题集',job:'Job · 一个问题集版本',task:'Task · 一个具体问题'}[level];$('#title').textContent=level==='block'?B.title:level==='job'?B.versions[id].name:B.questions[id].title;$('#state').textContent=level==='block'?'第二版准备中':level==='job'?B.versions[id].state:B.questions[id].state;$('#goal').textContent=level==='block'?B.goal:level==='job'?B.versions[id].goal:B.questions[id].goal;$('#views').innerHTML=tabs.map(([key,label])=>`<a ${key===view?'aria-current="page"':''} class="${key===view?'active':''}" href="${href(level,id,key)}">${label}</a>`).join('');
 $('#content').innerHTML=view==='overview'?overview(level,id):view==='plan'?plan(level,id):view==='questions'?questions(level,id):view==='findings'?findings(level,id):view==='ideas'?ideas():view==='method'?method(id):taskQuestion(id);$('#main').setAttribute('data-route',`${level}/${id}/${view}`);
}
function dialog(title,body){$('#detail-title').textContent=title;$('#detail-body').innerHTML=body;$('#detail').showModal();}
function findingDetail(id){const f=B.findings[id];dialog(f.title,`<p>${esc(f.body)}</p><h3>依据</h3>${f.evidenceIds.map(source).join('<br>')}<h3>对工作的影响</h3><p>${esc(f.consequence)}</p><h3>同一来源</h3><p class="sourcepath">${esc(f.source)}</p><p class="muted">原型中只在 model.js 的 findings.${f.id} 保存这一条示例记录。以下三个视图读取同一对象。</p><div class="actions">${link('block','book','findings','Block 中查看')}${link('job',f.version,'findings','Job 中查看')}${B.questions[f.owner]?link('task',f.owner,'findings','Task 中查看'):''}</div>`);}
function compare(id){const v=B.versions[id];if(!v.previous)return dialog('第一版', '<p>第一版没有前置版本。本原型从第二版开始展示升级过程。</p>');dialog(`${v.previous} → ${id}`,`<div class="compare"><div><h3>原版本</h3><p>${esc(B.versions[v.previous].goal)}</p></div><div><h3>本版</h3><p>${esc(v.goal)}</p></div></div><h3>问题变化</h3>${v.questionIds.map(qid=>`<div class="row">${pill(B.questions[qid].owner===id?'新增':'沿用')} ${link('task',qid,'question',qid+' '+B.questions[qid].title)}</div>`).join('')}<p class="muted">沿用的问题指向旧 Task。真正修改问题时，保存新的版本定义，并保留旧定义。</p>`);}
function review(id){dialog('发布条件',`<p>${esc(B.versions[id].name)}</p><ul class="checks"><li>○ 新增或修改的问题，证据计划通过独立审查</li><li>○ 所需脚本完成，并通过独立审查</li><li>○ 整版问题、依赖及解释边界经过检查</li><li>○ 分段方案已由人确认</li><li>○ 人确认发布，冻结版本</li></ul><p class="muted">原型只展示条件，不创建签名，也不改变任何真实版本。</p>`);}
function draft(){dialog('起草下一版',`<p>以第二版为参考，保留未修改问题的引用；本次仅演示草稿入口。</p><p class="callout">第二版尚未发布。当前讨论中的后续方向是“分组中的时间变化”，尚未形成完整计划。</p><label for="draft-goal">下一版目标</label><textarea id="draft-goal" rows="3" style="width:100%;font:inherit;padding:10px;margin:10px 0;border:1px solid #dfe4ea;border-radius:6px">评估分组中的时间变化是否值得形成新问题。</textarea><button class="primary" id="confirm-draft">预览下一版草稿</button>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.source){const s=B.sources[b.dataset.source];if($('#detail').open)$('#detail').close();dialog(s.name,`<p>${esc(s.text)}</p><p class="sourcepath">${esc(s.path)}</p>`);}else if(b.dataset.finding)findingDetail(b.dataset.finding);else if(b.dataset.compare)compare(b.dataset.compare);else if(b.dataset.review)review(b.dataset.review);else if(b.id==='close')$('#detail').close();else if(b.id==='draft-version')draft();else if(b.id==='confirm-draft'){const goal=$('#draft-goal').value.trim();if(!goal){$('#draft-goal').focus();return;}B.versions.v3={name:'第三版 · 后续探索',state:'草稿（仅预览）',goal,previous:'v2',questionIds:[...B.versions.v2.questionIds],findingIds:[],motivation:'从问题集的改进建议出发，探索下一版的范围。尚未发布。'};$('#detail').close();location.hash='#job/v3/overview';}else if(b.id==='design-note'){dialog('设计说明',`<p>这是 Question Book 的交互原型，聚焦版本 Job。页面状态和 Findings 为示例，不代表真实研究进度。</p><ul><li>层级表示范围，view 表示角度。</li><li>计划与结果同处展示。</li><li>Findings 在所属层记录一次，上层引用。</li><li>旧问题定义沿用引用，真正修改时保留版本历史。</li><li>起草下一版只改变本页面内存；刷新后恢复。</li></ul><p>完整内容契约与实现差距见同目录 DESIGN.md。</p>`);}});
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')&&$('#detail').open)$('#detail').close();});
document.addEventListener('change',e=>{if(e.target.id==='version-select'){const val=e.target.value;const v=B.versions[val];$('#content').innerHTML=`<div class="toolbar"><h2>Questions</h2><label>版本 <select id="version-select">${Object.keys(B.versions).map(k=>`<option ${k===val?'selected':''}>${k}</option>`).join('')}</select></label></div><div class="paper">${questionRows(v.questionIds,val)}</div><p class="muted">原型只展开 I02 与 K02 两个问题。</p>`;}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
</script></body></html>
