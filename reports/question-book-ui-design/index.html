<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Book · 版本工作台原型</title><link rel="stylesheet" href="style.css"></head>
<body><div class="prototype">设计原型 · 示例内容与状态 · 操作仅在当前页面演示</div>
