<rect x="401.1" y="406.8" width="136.6" height="206.8" rx="3" fill="none" stroke="#1f5aa8" stroke-width="1.5"/>
<text x="469.4" y="446.8" font-size="22" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="middle">2 Reason</text>
<text x="469.4" y="475.4" font-size="22" fill="#1c1c1c" font-weight="bold" font-family="'Times New Roman', Times, serif" text-anchor="middle">ideas</text>
