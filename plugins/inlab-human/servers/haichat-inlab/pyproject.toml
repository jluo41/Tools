[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haichat-inlab"
version = "0.1.0"
description = "HAI-Chat In-Lab Console — clinical model console (patients, raw record, endpoint scores)"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    # [standard] pulls in the websockets library — required for /ws/haichat; plain
    # uvicorn returns 404 on the WS upgrade ("No supported WebSocket library").
    "uvicorn[standard]",
    # the HaiChat drawer (/ws/haichat) runs on the Claude Agent SDK against the
    # local Claude Code login — without it the console still serves the
    # deterministic REST/SPA, but the agent socket reports itself unavailable.
    "claude-agent-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["."]
