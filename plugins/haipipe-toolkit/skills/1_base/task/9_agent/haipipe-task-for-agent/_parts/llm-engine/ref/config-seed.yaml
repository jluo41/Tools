_meta:
  purpose: |
    <describe what this LLM task does>
  input: scripts/config/prompts/system.md + scripts/config/prompts/user.md
  output: $OUTPUT_ROOT/<task>/runs/<run>/result/summary.json + _WorkSpace/LLMCallStore/...

prompts:  # Task-relative; every Run of the Task shares them
  system: scripts/config/prompts/system.md
  user: scripts/config/prompts/user.md

transport: auto

transports:
  claude_sdk:
    model: haiku
    max_turns: 1
  openai_codex_sdk:
    model: gpt-5.6-luna

store:
  llm_call_store: _WorkSpace/LLMCallStore
  sdk_session_dir: _WorkSpace/LLMCallStore/.sdk_sessions

batch:
  max_workers: 1
  max_consecutive_failures: 5
  timeout_seconds: 300
