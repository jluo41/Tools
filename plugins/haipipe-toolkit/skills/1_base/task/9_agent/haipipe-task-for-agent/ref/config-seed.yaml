# =============================================================================
# Template for runs/rNN_<run>/config.yaml — LLM agent task (a Block not yet moved: scripts/config/rNN_<run>.yaml)
# =============================================================================

_meta:
  purpose: |
    <e.g., Summarize eval logs across an eval Task's r01..r05 Runs into a markdown digest>
  note: |
    <e.g., Used Opus 4.7; expect ~3k tokens output; cost ≈ $0.10>
  input: |
    <e.g., Each run's $OUTPUT_ROOT/<task>/runs/rNN_<run>/result/eval_log.txt; scripts/config/prompts/system.md + user.md>
  output: |
    $OUTPUT_ROOT/<task>/runs/rNN_<run>/result/{transcript.json, summary.md}


# =============================================================================
# Agent params
# =============================================================================

model: claude-opus-4-8                  # or claude-sonnet-5 / claude-haiku-4-5-20251001
max_tokens: 4096
temperature: 0.0

prompts:                                # Task-relative; every Run of the Task shares them
  system: scripts/config/prompts/system.md
  user:   scripts/config/prompts/user.md

tools: []                               # e.g. [Read, Bash] for tool-use loops

inputs:                                 # context to inject into user.md placeholders
  eval_log_dir: <resolved-upstream-task-result>/
  date_range:   2026-05-01..2026-05-24

api:
  base_url: env:ANTHROPIC_BASE_URL      # read from env
  api_key:  env:ANTHROPIC_API_KEY
