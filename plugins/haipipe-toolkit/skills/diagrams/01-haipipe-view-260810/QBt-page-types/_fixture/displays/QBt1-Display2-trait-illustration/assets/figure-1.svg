<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agreeableness construct and observable signal</title>
  <desc id="desc">Panel A shows interpersonal warmth and cooperation. Panel B shows patient reviews as an observation layer with a boundary against direct latent personality measurement.</desc>
  <rect width="1200" height="520" rx="28" fill="#f7f4ed"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#252525">One View, two complementary readings</text>
  <rect x="60" y="100" width="500" height="340" rx="24" fill="#fffdf8" stroke="#47766f" stroke-width="4"/>
  <text x="92" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#315c56">Figure 1a · Construct meaning</text>
  <circle cx="310" cy="245" r="82" fill="#dcebe7" stroke="#47766f" stroke-width="3"/>
  <text x="310" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#254943">Agreeableness</text>
  <text x="310" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#254943">interpersonal trait</text>
  <rect x="105" y="350" width="175" height="54" rx="15" fill="#efe2b8"/>
  <rect x="340" y="350" width="175" height="54" rx="15" fill="#efe2b8"/>
  <text x="192" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#4c4328">warmth</text>
  <text x="427" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#4c4328">cooperation</text>
  <line x1="275" y1="315" x2="210" y2="349" stroke="#8d7d48" stroke-width="3"/>
  <line x1="345" y1="315" x2="410" y2="349" stroke="#8d7d48" stroke-width="3"/>
  <path d="M 575 270 C 600 270, 600 270, 625 270" stroke="#777" stroke-width="4" fill="none"/>
  <polygon points="625,270 608,260 608,280" fill="#777"/>
  <rect x="640" y="100" width="500" height="340" rx="24" fill="#fffdf8" stroke="#8c5f63" stroke-width="4"/>
  <text x="672" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#70474b">Figure 1b · Observable signal</text>
  <rect x="710" y="190" width="360" height="78" rx="18" fill="#eadadd"/>
  <text x="890" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#653e43">Patient-authored reviews</text>
  <text x="890" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#653e43">descriptions of patient-facing behavior</text>
  <line x1="890" y1="268" x2="890" y2="318" stroke="#8c5f63" stroke-width="3"/>
  <polygon points="890,327 880,310 900,310" fill="#8c5f63"/>
  <rect x="730" y="327" width="320" height="64" rx="18" fill="#dcebe7"/>
  <text x="890" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#315c56">Patient-perceived signal</text>
  <text x="890" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#315c56">not direct latent personality</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="19" fill="#555">Claim ceiling: patient-perceived manifestation, not an error-free measure of latent personality.</text>
</svg>
