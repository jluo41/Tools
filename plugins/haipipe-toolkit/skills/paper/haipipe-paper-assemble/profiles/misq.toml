# MIS Quarterly manuscript presentation rules, blind-review copy (0.7.0, JL 260908
# "did you use the MISQ template?"). Venue behaviour only: prose, values, citations
# and display choices stay on the Section Pages. Flat keys drive
# scripts/latex_room_to_docx.py; the [latex] table drives write_master().
layout = "generic"
venue_label = "MIS Quarterly"
font = "Times New Roman"
line_numbers = false
heading_style = "numbered"
draft_label = "DRAFT — NOT SUBMISSION READY"
abstract_heading = "Abstract"
references_heading = "References"
include_main_displays = true

# ── what the venue PACK already measured ────────────────────────────────────
# Source of every number below: the haipipe-paper-venue store, which already held
# a measured MISQ pack while 0.7.0 of this profile was written from general
# knowledge instead (JL 260908: "Don't we have it in the haipipe-paper-venue???").
#   Tools/plugins/haipipe-toolkit/skills/paper/venue/playbook-utd-is/README.md
#   .../playbook-utd-is/MISQ/MISQ-abstract/style.md  (measured 2026-07-08 from
#   published MISQ Research Articles: Liu 2021 ~125w, Yin 2014 ~120w)
# MISQ takes WORD through ScholarOne and ships no LaTeX class, so the LaTeX lane is
# a reading copy that reproduces the manuscript rules and the .docx is the
# submission artifact. The four mechanical rules were verified 260908 against this
# desk's own v0728 submission (Bc-MISQ-Round/RD01/feedback/): Times New Roman,
# 12 pt, w:line=480 auto (double), pgMar 1440 twips (1 in) on all four sides.
venue_pack = "playbook-utd-is/MISQ"
abstract_words = [120, 160]      # pack-observed writing target, not an official cap
abstract_words_max = 185         # local pack prescription; official contract takes precedence
abstract_sentences = [4, 7]      # one unstructured prose paragraph, no labeled fields
main_pages = [40, 50]            # Research Article, double-spaced
hero_display = "research model / theoretical framework figure"

# ── the Word front matter, which is the SUBMISSION artifact ──────────────────
# Before 0.7.8 this profile said layout = "generic", and "generic" in
# latex_room_to_docx.py WAS the medical-journal title page: the MISQ build shipped
# a "Running title:" line with no value (under running_head = false), an
# "Article type" line, and two build counts inside the deliverable.
# The MISQ manuscript is a BLIND copy: the co-author's official-format file carries
# the title and nothing else before the abstract. Author names, affiliations and the
# corresponding author live in ScholarOne's metadata and a separate title-page file.
title_page_fields = ["title"]
citation_style = "author-date"   # MISQ is author-date, matching the LaTeX lane's apalike; numbered Vancouver is the medical convention
appendices = "main"              # Appendix A-E sit inside the manuscript after the references, not in a separate supplement file
supplement_table_prefix = "Table A"
supplement_figure_prefix = "Figure A"
author_placeholder = "[AUTHOR NAMES: first, middle, and last names]"
displays_position = "inline"     # v0728, the file MISQ received, interleaves its tables with the prose
main_table_prefix = "Table "
main_figure_prefix = "Figure "
table_header_fill = ""           # no colour behind table headers: the official-format file and v0728 have none (JL 260928 "why the header is with color?")
# ── the Word layout of the co-author's official-format file (delivery/word-feedback/, JL 260928
#    "does this really following the MISQ word template?"), measured from its styles.xml/document.xml ──
front_matter = "title-abstract-keywords"   # page 1 = Title style, centred ABSTRACT, abstract, Keywords; break before INTRODUCTION
abstract_line_spacing = 1.0      # abstract and keywords single-spaced (w:line=240); the body stays double
heading_align = "center"         # Heading 1 and Heading 2 are centred
caption_plain = true             # captions bold, upright, black (the Caption style), not italic grey
table_borders = "horizontal"     # top, bottom and row rules; no vertical lines
table_font_size = 8              # table cells 8 pt (w:sz 16)


[latex]
spacing = "double"          # double-spaced throughout, references included
bibstyle = "apalike"        # closest stock author-date style; MISQ's own .bst is not shipped, journal names print as the .bib gives them
displays = "inline"         # "inline": at first reference, for review · "end": every float on its own page after the text (endfloat), for production
appendix_newpage = true     # lettered appendices after the references, each on a new page
title_page = "inline"       # page 1 = title, abstract and keywords, as in the official-format file (JL 260928); was "separate"
abstract_page = true        # \clearpage after the abstract (and keywords), so the first section starts page 2
acknowledgments = false     # blind copy: no Acknowledgments section; funding and thanks go in the separate title-page file (JL 260928)
running_head = false        # no running head on the blind copy; the DRAFT word still prints while the build is a draft
