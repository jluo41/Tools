# JAMA Internal Medicine manuscript presentation rules.
# This file contains venue behaviour only.  Paper prose, values, citations,
# and display choices remain in the desk room and its evidence lock.
layout = "jama-internal-medicine"
venue_label = "JAMA Internal Medicine"
font = "Times New Roman"
line_numbers = true
line_number_distance = 360
restart_line_numbers_each_page = false
# JAMA's manuscript layout uses directly formatted headings so line numbering
# is stable in LibreOffice/Word, rather than relying on application-specific
# Heading style inheritance.
heading_style = "normal"
headings_keep_with_next = false
draft_label = "DRAFT — NOT SUBMISSION READY"
key_points_heading = "KEY POINTS"
abstract_heading = "ABSTRACT"
references_heading = "REFERENCES"
supplement_title = "ONLINE-ONLY SUPPLEMENTAL MATERIAL"
# JAMA numbers supplement floats eTable 1, eFigure 1, as the LaTeX lane does
supplement_table_prefix = "eTable "
supplement_figure_prefix = "eFigure "
# JAMA: the first page lists every element and its title. The key was read and never set, so page 1 held only the title.
supplement_contents = true
# headings print as the source writes them ("eAppendix 1. Inherited exposure"), never in capitals
supplement_heading_upper = false
include_main_displays = false
