<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Portal Fill Sheet</title><meta name=portal-summary content="__SUMMARY__"><link rel=icon href="data:,">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#16181d;--mute:#667;--line:#e3e3e6;--blue:#1864ab;--wash:#e7f5ff;--ok:#2b8a3e;--okw:#ebfbee;--ask:#b35c00;--askw:#fff4e6;--bad:#c92a2a;--badw:#fff5f5;--note:#c2255c}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1b1d22;--ink:#ecedf0;--mute:#9a9ea8;--line:#2d3038;--blue:#74b5ee;--wash:#16293a;--ok:#69db7c;--okw:#16291c;--ask:#ffb15c;--askw:#2e2214;--bad:#ff8787;--badw:#2e1a1a;--note:#f783ac}}
*{box-sizing:border-box}html{scroll-padding-top:150px}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px 10px}
.t1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.t1 h1{font-size:20px;margin:0;letter-spacing:-.01em}.ptitle{font-size:13px;color:var(--mute);flex:1 1 280px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t1 .pct{margin-left:auto;font-size:14px;font-weight:600}
.bar{display:flex;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:9px 0 10px}.bar i{display:block;background:var(--ok);transition:width .25s}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.f{white-space:nowrap;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute)}
.f[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}@media (prefers-color-scheme:dark){.f[aria-pressed=true]{color:#0d1a26}}
#jump{display:none;width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px}
nav{position:sticky;top:130px;align-self:start;font-size:13.5px}nav a{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--card)}nav a.on{background:var(--wash);color:var(--blue);font-weight:600}nav a span{color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.settle{background:var(--badw);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:12px;padding:12px 16px;margin-bottom:22px}
.settle.clear{background:var(--okw);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.settle.clear h2{color:var(--ok)}.settle h2{font-size:14px;margin:0 0 4px;color:var(--bad)}.settle a{display:block;color:var(--ink);font-size:14px;text-decoration:none;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settle a.conf{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--bad) 25%,var(--line))}.settle a.gone{text-decoration:line-through;opacity:.5}.settle a b{font-weight:600}.settle a:hover b{text-decoration:underline}.settle small{color:var(--mute);font-size:13px}
.stp{font-size:14px;font-weight:700;margin:24px 0 8px;display:flex;gap:8px;align-items:baseline}.stpw{margin-top:26px}.stpw:first-child{margin-top:0}.stp{margin-top:0!important}.stp span{font-weight:400;color:var(--mute);font-size:13px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{border-top:1px solid var(--line)}.it:first-child{border-top:0}.it.cur{box-shadow:inset 3px 0 0 var(--blue)}.it.cur .nm::after{content:"Next";margin-left:8px;font-size:11px;font-weight:700;color:var(--blue)}
.h{display:grid;grid-template-columns:22px minmax(120px,210px) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}.h:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}.h:hover{background:color-mix(in srgb,var(--wash) 45%,transparent)}
.ck{width:18px;height:18px;accent-color:var(--ok);margin:0;cursor:pointer}
.nm{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}.pv{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}.s-paste,.s-upload{background:var(--wash);color:var(--blue)}.s-keep{background:var(--okw);color:var(--ok)}.s-ask{background:var(--askw);color:var(--ask)}.s-differ,.s-missing{background:var(--badw);color:var(--bad)}
.act{min-width:64px;text-align:center;font-size:13px;font-weight:600;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink)}.act:hover{border-color:var(--blue);color:var(--blue)}.act.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ghost{visibility:hidden}
.why{grid-column:2/-1;font-size:13px;margin-top:-6px;color:var(--ask)}.it[data-s=differ] .why,.it[data-s=missing] .why{color:var(--bad)}
.it.done .nm{color:var(--mute);font-weight:500}.it.done .pv{opacity:.65}
.d{display:none;padding:2px 14px 14px 48px}.it.open .d{display:block}
.d pre{margin:0 0 10px;padding:10px 12px;background:var(--bg);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.d dl{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;margin:0;font-size:13px}.d dt{color:var(--mute)}.d dd{margin:0;overflow-wrap:anywhere}.d ul{margin:0;padding-left:16px}
.stn{font-size:13px;color:var(--ask);margin:-4px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);text-align:left}.chip:hover{border-color:var(--blue);color:var(--blue)}.chip small{display:block;font-size:11px;color:var(--mute)}.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}.chip.ok small{color:#fff}.chip.no{border-color:var(--bad)}.it.hide{display:none}.stpw.hide{display:none}
.stop{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin:0 0 12px}.foot{font-size:12.5px;color:var(--mute);margin-top:22px}
@media (max-width:960px){.h{grid-template-columns:22px minmax(0,1fr) auto;gap:6px 10px}.pv{grid-column:2/-1;grid-row:2}.pill{grid-column:2;grid-row:3;justify-self:start}.act{grid-column:3;grid-row:1}.why{grid-column:2/-1}}
@media (max-width:760px){.ptitle{display:none}#jump{display:block}.act{min-height:40px;display:flex;align-items:center;justify-content:center}.ck{width:22px;height:22px}.f{padding:7px 12px}.t1 h1{font-size:17px}.bar{margin:6px 0 8px}.wrap{display:block;padding:14px 12px 50px}nav{display:none}.top-in{padding:12px}.settle a{white-space:normal}.d{padding-left:14px}.d dl{grid-template-columns:1fr}.d dt{margin-top:6px}}
</style></head><body>__NOTE__
<header class=top><div class=top-in><div class=t1><h1>__VENUE__ portal</h1><span id=ptitle class=ptitle></span><span class=pct id=pct></span></div><div class=bar><i id=bar></i></div><div class=filters id=filters></div><select id=jump aria-label="Go to a portal step"></select></div></header>
<div class=wrap><nav id=nav></nav><main>__ODD__<div id=settle></div><div id=list></div><p class=foot id=empty hidden>Nothing left here. Choose All to see every field.</p><p class=foot>__PORTAL__. This page never types into the portal.</p></main></div>
<script>
const R=__DATA__;R.forEach(r=>{r.found=r.found.map(x=>/Built, not approved/.test(x)?"Draft until the authors approve this build":x);if(r.step==="After submitting"&&/before (you )?submit/i.test(r.ask+" "+r.note+" "+r.label)||r.step==="After submitting"&&/^submit/i.test(r.label))r.step="Before Submit"});const isAuthor=r=>/^Author \d/.test(r.label);const parts=r=>{const out=[];let street=false;const xs=r.value.split(/;\s+|,\s+/).filter(Boolean);xs.forEach((x,i)=>{const m=x.match(/^([A-Z]{2}) (\d{5}(?:-\d{4})?)$/),nx=xs[i+1]||"";if(i===0)out.push(["Name",x]);else if(/@/.test(x))out.push(["Email",x]);else if(/^[+\d][\d() .-]{6,}$/.test(x))out.push(["Phone",x]);else if(m){out.push(["State",m[1]],["Zip",m[2]])}else if(/^\d+ /.test(x)){street=true;out.push(["Street",x])}else if(out.every(o=>o[0]==="Name"||o[0]==="Degree")&&/^[A-Za-z.]{2,6}$/.test(x))out.push(["Degree",x]);else if(/^[A-Z][a-z]+$/.test(x)&&(street||/^[A-Z][a-z]+$/.test(nx)&&(!xs[i+2]||/@/.test(xs[i+2]))||/^[A-Z]{2} \d/.test(nx))){out.push(["City",x]);street=false}else if(/^[A-Z][a-z]+$/.test(x)&&out.length&&out[out.length-1][0]==="City")out.push(["State",x]);else out.push(["Affiliation",x])});return out};const W={keep:"In the draft",paste:"Paste or pick",upload:"Upload",ask:"You decide",differ:"Portal vs manuscript",missing:"No file"};
const KEY="__KEY__";let D={};try{D=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const isDone=r=>r.state==="keep"||!!D[r.id];const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const steps=[...new Set(R.map(r=>r.step))].sort((a,b)=>(a==="After submitting")-(b==="After submitting"));const slug=s=>"st-"+steps.indexOf(s);let filter="todo";
const FILTERS=[["todo","To do",r=>!isDone(r)],["differ","Portal vs manuscript",r=>r.state==="differ"||r.state==="missing"],["ask","You decide",r=>r.state==="ask"],["paste","Paste or pick",r=>r.state==="paste"],["upload","Upload",r=>r.state==="upload"],["all","All",r=>true]];
function why(r){if(r.state==="differ")return(r.found[0]||r.note||r.ask);if(r.state==="missing")return r.found[0]||"not built yet";if(r.state==="ask")return r.ask;return""}
function item(r){const v=r.value||r.file||r.leave||"";const body=r.statement||r.value;
 const act=isAuthor(r)?`<button class=act data-fields>Fields</button>`:r.href?`<a class=act href="${e(r.href)}" target=_blank data-up>Open</a>`:(body?`<button class=act data-copy title="Copy, mark done, go to the next">Copy</button>`:`<span class="act ghost">Copy</span>`);
 const rows=[["Portal says",r.says],["Draft holds",r.now],["Note",r.note===(why(r)||(isAuthor(r)?r.note:""))?"":r.note],["Also",r.state==="upload"?"":r.found.filter(x=>x!==why(r)).join(" ")],["From",r.source]].filter(x=>x[1]);
 const dl=rows.map(x=>`<dt>${e(x[0])}</dt><dd>${e(x[1])}</dd>`).join("")+(r.options.length?`<dt>Options</dt><dd><ul>${r.options.map(o=>`<li>${e(o)}</li>`).join("")}</ul></dd>`:"");
 const w=why(r)||(isAuthor(r)?r.note:"");return `<div class=it id="i-${e(r.id)}" data-id="${e(r.id)}" data-s="${r.state}"><div class=h tabindex=0><input type=checkbox class=ck aria-label="Done: ${e(r.label)}" ${isDone(r)?"checked":""} ${r.state==="keep"?"disabled":""}><div class=nm>${e(r.label)}</div><div class=pv>${e(v)}</div><span class="pill s-${r.state}">${W[r.state]}</span>${act}${w?`<div class=why>${e(w)}</div>`:""}</div><div class=d>${isAuthor(r)?`<div class=chips>${parts(r).map(x=>`<button class=chip data-part="${e(x[1])}" title="Copy this field"><small>${e(x[0])}</small>${e(x[1])}</button>`).join("")}</div>`:body?`<pre>${e(body)}</pre>`:""}<dl>${dl}</dl></div></div>`}
document.getElementById("list").innerHTML=steps.map(s=>`<section class=stpw id="${slug(s)}" data-step="${e(s)}"><div class=stp>${e(s)} <span class=n></span></div>${[...new Set(R.filter(r=>r.step===s&&r.state==="upload").flatMap(r=>r.found))].map(x=>`<div class=stn>${e(x)}</div>`).join("")}<div class=list>${R.filter(r=>r.step===s).map(item).join("")}</div></section>`).join("");
const need=[...R.filter(r=>r.state==="differ"||r.state==="missing"),...R.filter(r=>r.state==="ask"&&!/^submit$/i.test(r.label)&&r.step!=="After submitting")];
document.getElementById("settle").innerHTML=need.length?`<div class=settle id=settlebox><h2 id=settleh>Settle before you submit</h2>${need.map(r=>`<a href="#i-${e(r.id)}" data-jump="${e(r.id)}" data-need="${e(r.id)}" title="${e(why(r))}" class="${r.state==="differ"?"conf":""}">${r.state==="differ"?'<span class="pill s-differ">Portal vs manuscript</span> ':""}<b>${e(r.label)}</b> <small>${e(why(r))}</small></a>`).join("")}</div>`:"";
function paint(){const fa=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:"";paint0();mark();if(fa){const b=document.querySelector(`[data-f="${fa}"]`);if(b)b.focus()}}function paint0(){const n=R.filter(isDone).length,t=R.length,p=Math.round(100*n/t);
 document.getElementById("pct").textContent=`${t-n} left of ${t}`;document.getElementById("bar").style.width=p+"%";
 document.getElementById("filters").innerHTML=FILTERS.map(f=>`<button class=f data-f="${f[0]}" aria-pressed="${filter===f[0]}">${f[1]} · ${f[0]==="all"?R.length:R.filter(r=>f[2](r)&&!isDone(r)).length}</button>`).join("");
 const test=r=>filter==="all"||FILTERS.find(f=>f[0]===filter)[2](r)&&!isDone(r);document.getElementById("settle").style.display=(filter==="paste"||filter==="upload")?"none":"";
 R.forEach(r=>{const el=document.getElementById("i-"+r.id);el.classList.toggle("hide",!test(r));el.classList.toggle("done",isDone(r));el.querySelector(".ck").checked=isDone(r)});
 document.getElementById("empty").hidden=R.some(test);document.querySelectorAll(".stpw").forEach(x=>{const rs=R.filter(r=>r.step===x.dataset.step);x.classList.toggle("hide",!rs.some(test));x.querySelector(".stp .n").textContent=`${rs.filter(isDone).length} of ${rs.length}`});
 {const box=document.getElementById("settlebox");if(box){const all=need.every(isDone);box.classList.toggle("clear",all);document.getElementById("settleh").textContent=all?"Everything is settled":"Settle before you submit"}}document.querySelectorAll("[data-need]").forEach(a=>a.classList.toggle("gone",isDone(R.find(r=>r.id===a.dataset.need))));{const sel=document.getElementById("jump"),keep=sel.value;sel.innerHTML=steps.map(s=>`<option value="${slug(s)}">${e(s)}</option>`).join("");if(keep)sel.value=keep}document.getElementById("nav").innerHTML=steps.map(s=>{const rs=R.filter(r=>r.step===s);return rs.some(test)?`<a href="#${slug(s)}" data-sec="${slug(s)}">${e(s)}<span>${rs.filter(isDone).length}/${rs.length}</span></a>`:""}).join("")}
function copy(t,done,fail){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fail)}else{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();ok?done():fail()}}
function next(id){const i=R.findIndex(r=>r.id===id);const test=r=>filter==="all"||FILTERS.find(f=>f[0]===filter)[2](r);const n=R.slice(i+1).find(r=>test(r)&&!isDone(r)&&(r.value||r.statement||r.href));document.querySelectorAll(".it.cur").forEach(x=>x.classList.remove("cur"));if(n){const el=document.getElementById("i-"+n.id);el.classList.add("cur");el.scrollIntoView({block:"center",behavior:"smooth"})}}
document.addEventListener("click",ev=>{const t=ev.target;const f=t.closest("[data-f]");if(f){filter=f.dataset.f;paint();return}
 const na=t.closest("nav a");if(na){pin=na.dataset.sec;setTimeout(mark,0);return}const j=t.closest("[data-jump]");if(j){ev.preventDefault();{const rr=R.find(x=>x.id===j.dataset.jump);if(filter!=="all"&&(isDone(rr)||!FILTERS.find(f=>f[0]===filter)[2](rr)))filter="all"}paint();const el=document.getElementById("i-"+j.dataset.jump);el.classList.add("open");el.scrollIntoView({block:"center",behavior:"smooth"});return}
 const it=t.closest(".it");if(!it)return;const r=R.find(x=>x.id===it.dataset.id);
 const cp=t.closest("[data-part]");if(cp){copy(cp.dataset.part,()=>{cp.classList.remove("no");cp.classList.add("ok")},()=>{cp.classList.add("no")});return}if(t.closest("[data-fields]")){it.classList.toggle("open");return}if(t.closest("[data-copy]")){const b=t.closest("[data-copy]");copy(r.statement||r.value,()=>{b.textContent="Copied";b.classList.add("ok");if(!r.ask&&r.state!=="differ"){D[r.id]=1;save()}setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok");paint();next(r.id)},1000)},()=>{b.textContent="Copy failed";it.classList.add("open");setTimeout(()=>{b.textContent="Copy"},1600)});return}
 if(t.closest("[data-up]")){return}
 if(t.classList.contains("ck")){if(t.checked)D[r.id]=1;else delete D[r.id];save();if(t.checked){it.classList.add("done");setTimeout(paint,700)}else paint();return}
 if(t.closest(".h"))it.classList.toggle("open")});
let pin="";function mark(){let cur="";document.querySelectorAll(".stpw:not(.hide)").forEach(x=>{if(x.getBoundingClientRect().top<document.querySelector(".top").offsetHeight+40)cur=x.id});if(scrollY<5){const first=document.querySelector(".stpw:not(.hide)");cur=first?first.id:""}if(pin)cur=pin;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.sec===cur));if(cur)document.getElementById("jump").value=cur}
addEventListener("scroll",mark,{passive:true});["wheel","touchmove","keydown"].forEach(k=>addEventListener(k,()=>{pin=""},{passive:true}));const pad=()=>{document.documentElement.style.scrollPaddingTop=(document.querySelector(".top").offsetHeight+10)+"px"};addEventListener("resize",pad);pad();document.getElementById("jump").addEventListener("change",ev=>{const v=ev.target.value;pin=v;const st=steps.find(x=>slug(x)===v);if(filter!=="all"&&!R.some(r=>r.step===st&&!isDone(r)&&FILTERS.find(f=>f[0]===filter)[2](r))){filter="all";paint();ev.target.value=v}document.getElementById(v).scrollIntoView({behavior:"smooth"})});document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("h")){ev.preventDefault();ev.target.closest(".it").classList.toggle("open")}});{const tt=R.find(r=>r.label==="Title");if(tt)document.getElementById("ptitle").textContent=tt.value}paint();
</script></body></html>
