interface:
  display_name: "Draw Logic Tree"
  short_description: "claim → reasons → Bullets, left to right, on a Page's RoadMap canvas"
  default_prompt: "Use $draw-logic-tree to draw, revise or check the logic of one Page: the claim at the left, the reasons it rests on beside it, every Bullet a row in one column with room to write beside it, colored by its evidence."
policy:
  allow_implicit_invocation: true
