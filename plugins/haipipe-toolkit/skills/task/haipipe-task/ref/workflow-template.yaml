# Resolve placeholders against the Run catalogue and any declared Plugin.
# A standalone definition without Workspace surfaces omits plugin and cells.
# Notebook output is required only when the Run notebook policy enables it.
name: <task-workflow>
purpose: Execute one bounded Task Run
input:
  args:
    config: scripts/config/rNN_<run>.yaml
  files_in: &id001
  - scripts/<worker>.py
  - scripts/config/rNN_<run>.yaml
  - runs/rNN_<run>.sh
owner: haipipe-task
plugin:
  id: <owning-plugin>
  workspace_roster_ref: <plugin-definition>#workspace_roster
  workspace_ids:
  - <workspace-id>
run_specs:
- id: execute
  run_type: task.execute
  purpose: Execute one bounded Task Run
  target: tasks/bNN_<block>/jNN_<job>/tNN_<task>
  actor:
    mode: automatic
    owner: haipipe-task
  action: execute-ticket
  input: *id001
  entry_gate:
    mode: automatic
    assertion: config, inputs and current code review resolve
  exit_gate:
    mode: automatic
    assertion: all required Results pass the domain checks and runtime receipt is complete
  routes:
    pass: CLOSE
    fail: HOLD
    blocked: HOLD
  result:
    payload:
      status: complete
      artifacts:
      - $OUTPUT_ROOT/<task>/results/rNN_<run>/
    receipt: $OUTPUT_ROOT/<task>/results/rNN_<run>/runtime.yaml
  cardinality: 1
  cells:
  - workspace_id: <workspace-id>
    mode: action
    owner_skill: haipipe-task
    worker_skill_chain:
    - <resolved-specialist>
    interaction: execute declared Ticket
    authority_change: create
    source_projection: authoritative Result
entry:
- execute
terminal:
- CLOSE
- HOLD
output:
  returns:
  - status
  - artifacts
  - receipts
  files_out:
  - $OUTPUT_ROOT/<task>/results/rNN_<run>/runtime.yaml
  - $OUTPUT_ROOT/<task>/notebooks/rNN_<run>.ipynb
