# =============================================================================
# Template for <task>/scripts/config/<RUNNAME>.yaml — display-input Task
# =============================================================================

_meta:
  purpose: |
    <e.g., Main-paper display input: MAE by model size, val + test-id>
  note: |
    <e.g., 5 model sizes × 2 splits = 10 points; error bars across 3 seeds>
  input: |
    <e.g., Eval results from tasks B01/01..05 (one per model size)>
  output: |
    $OUTPUT_ROOT/results/<task>/<run>/{source_data.csv, provenance.json}
  provenance: |
    provenance.json records task holder, run, upstream artifacts, selection logic, output hash,
    and `approved_for_display_intake: true` only when this CSV is safe to snapshot into a paper.


# =============================================================================
# Display-input params
# =============================================================================

display_kind: figure                    # intended consumer: figure | table | diagram | illustration

source_runs:                            # full Run ids + resolved Result paths
  - run: b01j01t01r01
    result: <resolved-upstream-result>

summary_params:                         # this task's responsibility: facts, not visual styling
  columns: [model_size, split, mae, ci95]
  group_by: [model_size, split]
  filters: []
  unit_of_analysis: "one model-size × split aggregate"
  output_contract: source_data.csv      # small, display-safe summary only

# The Display unit decides axes, color, layout, caption, and target format.
