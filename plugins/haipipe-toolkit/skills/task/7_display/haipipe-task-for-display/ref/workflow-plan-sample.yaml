# Definition template: one independently executable config/Ticket variant.
# Expand variants as Run Specs only when independently commissioned.
# Resolve placeholders, catalogue key and every Plugin-owned Workspace Cell before use.
# Steps and section labels describe internal work; they never allocate Runs.
# Schema: task/haipipe-workflow/ref/plan-schema.md
name: display-input-<NAME>
purpose: Produce a verified display-ready summary for <NAME> from upstream results
input:
  args:
    config: scripts/config/rNN_<run>.yaml
    display_kind: <figure | table | diagram | illustration>
  files_in: &id001
  - scripts/config/rNN_<run>.yaml
  - t01_display_input_summary/scripts/prepare_display_input.py
  - t01_display_input_summary/scripts/config/rNN_<run>.yaml
  - <resolved-upstream-result>/metrics.json
owner: haipipe-task-for-display
plugin:
  id: <owning-plugin>
  workspace_roster_ref: <plugin-definition>#workspace_roster
  workspace_ids:
  - <workspace-id>
run_specs:
- id: execute
  run_type: task.execute
  purpose: Produce a verified display-ready summary for <NAME> from upstream results
  target: tasks/bNN_<block>/jNN_<job>/tNN_<task>
  actor:
    mode: automatic
    owner: haipipe-task-for-display
  action: execute-ticket
  input: *id001
  entry_gate:
    mode: automatic
    assertion: config, inputs and current code review resolve
  exit_gate:
    mode: automatic
    assertion: all required Results pass the domain checks and runtime receipt is complete
  routes:
    pass: CLOSE
    fail: HOLD
    blocked: HOLD
  result:
    payload: &id002
      status: complete
    receipt: $OUTPUT_ROOT/<task>/results/rNN_<run>/runtime.yaml
  cardinality: 1
  cells:
  - workspace_id: <workspace-id>
    mode: action
    owner_skill: haipipe-task-for-display
    worker_skill_chain:
    - haipipe-task-for-display
    interaction: execute declared Ticket
    authority_change: create
    source_projection: authoritative Result
  steps:
  - section: Load
    label: load:data
    required: true
    prompt: Load upstream results (metrics.json, source_data.csv)
    files_in:
    - <resolved-upstream-result>/metrics.json
    files_out: []
  - section: Summarize
    label: summary:aggregate
    required: true
    prompt: Produce the small display-ready aggregate; do not choose visual styling or emit a paper asset.
    files_in: []
    files_out: []
  - section: Validate
    label: validate:provenance
    required: true
    prompt: Record task holder, run, upstream artifacts, selected columns, filters, checksums, and the
      display-safety assertion in provenance.json.
    files_in: []
    files_out: []
  - section: Export
    label: export:display-input
    required: true
    prompt: Save source_data.csv + provenance.json to $OUTPUT_ROOT/t01_display_input_summary/results/<RUN>/;
      optional diagnostics stay in diagnostics/.
    files_in: []
    files_out:
    - $OUTPUT_ROOT/t01_display_input_summary/results/<RUN>/source_data.csv
    - $OUTPUT_ROOT/t01_display_input_summary/results/<RUN>/provenance.json
entry:
- execute
terminal:
- CLOSE
- HOLD
output:
  returns: *id002
  files_out:
  - $OUTPUT_ROOT/t01_display_input_summary/results/<RUN>/source_data.csv
  - $OUTPUT_ROOT/t01_display_input_summary/results/<RUN>/provenance.json
