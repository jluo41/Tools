# workflow-plan-sample.yaml — display task script-level plan
# Schema: task/haipipe-workflow/ref/plan-schema.md
# Task-level template: ../../../haipipe-task/ref/workflow-template.yaml
#
# Typical display-input phases: Load → Summarize → Validate → Export
# All outputs are small, display-safe inputs under
# $OUTPUT_ROOT/results/<task>/<run>/{source_data.csv, provenance.json}.

# ─── Header ──────────────────────────────────────────────────────
name: display-input-<NAME>
purpose: "Produce a verified display-ready summary for <NAME> from upstream results"
skill: haipipe-task-for-display

# ─── I: Input ────────────────────────────────────────────────────
input:
  args:
    config: t01_display_input_summary/scripts/config/<RUN>.yaml
    display_kind: <figure | table | diagram | illustration>
  files_in:
    - t01_display_input_summary/scripts/prepare_display_input.py
    - t01_display_input_summary/scripts/config/<RUN>.yaml
    - <resolved-upstream-result>/metrics.json

# ─── P: Phases ───────────────────────────────────────────────────
phases:

  - title: Load
    detail: "load upstream metrics or data"
    steps:
      - label: "load:data"
        type: agent
        required: true
        prompt: "Load upstream results (metrics.json, source_data.csv)"
        files_in:
          - <resolved-upstream-result>/metrics.json
        files_out: []

  - title: Summarize
    detail: "select and aggregate the exact values the display may use"
    steps:
      - label: "summary:aggregate"
        type: agent
        required: true
        prompt: "Produce the small display-ready aggregate; do not choose visual styling or emit a paper asset."
        files_in: []
        files_out: []

  - title: Validate
    detail: "verify the aggregate and record its provenance"
    steps:
      - label: "validate:provenance"
        type: agent
        required: true
        prompt: "Record task holder, run, upstream artifacts, selected columns, filters, checksums, and the display-safety assertion in provenance.json."
        files_in: []
        files_out: []

  - title: Export
    detail: "save the portable input package for a Display Intake"
    steps:
      - label: "export:display-input"
        type: agent
        required: true
        prompt: "Save source_data.csv + provenance.json to $OUTPUT_ROOT/results/t01_display_input_summary/<RUN>/; optional diagnostics stay in diagnostics/."
        files_in: []
        files_out:
          - $OUTPUT_ROOT/results/t01_display_input_summary/<RUN>/source_data.csv
          - $OUTPUT_ROOT/results/t01_display_input_summary/<RUN>/provenance.json

# ─── O: Output ───────────────────────────────────────────────────
output:
  returns:
    status: complete
  files_out:
    - $OUTPUT_ROOT/results/t01_display_input_summary/<RUN>/source_data.csv
    - $OUTPUT_ROOT/results/t01_display_input_summary/<RUN>/provenance.json
