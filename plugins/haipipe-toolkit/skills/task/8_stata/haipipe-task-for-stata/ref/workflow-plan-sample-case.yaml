# Definition template: one independently executable config/Ticket variant.
# Expand variants as Run Specs only when independently commissioned.
# Resolve placeholders, catalogue key and every Workbench-owned Workspace Cell before use.
# Steps and section labels describe internal work; they never allocate Runs.
# Schema: task/haipipe-workflow/ref/plan-schema.md
name: case-<COHORT>-<SOURCE>-<YEAR>
purpose: Trigger cohort cases and attach BFAF feature panels for <COHORT> <SOURCE> year <YEAR>
input:
  args:
    config: scripts/config/rNN_<run>.do
    year: <YEAR>
    source: <SOURCE>
  files_in: &id001
  - scripts/case_pipeline.do
  - scripts/config/<COHORT>.do
  - scripts/config/_source_<SOURCE>.do
  - scripts/config/rNN_<run>.do
  - _WorkSpace/1-CMS-Store/<CMS_ASSET>/year-<YEAR>/
  - _WorkSpace/0-External-Store/<NDC_GROUP>/
  - _WorkSpace/0-External-Store/<ICD_GROUP>/
owner: haipipe-task-for-stata
workbench:
  id: <owning-workbench>
  workspace_roster_ref: <workbench-definition>#workspace_roster
  workspace_ids:
  - <workspace-id>
run_specs:
- id: execute
  run_type: task.execute
  purpose: Trigger cohort cases and attach BFAF feature panels for <COHORT> <SOURCE> year <YEAR>
  target: tasks/bNN_<block>/jNN_<job>/tNN_<task>
  actor:
    mode: automatic
    owner: haipipe-task-for-stata
  action: execute-ticket
  input: *id001
  entry_gate:
    mode: automatic
    assertion: config, inputs and current code review resolve
  exit_gate:
    mode: automatic
    assertion: all required Results pass the domain checks and runtime receipt is complete
  routes:
    pass: CLOSE
    fail: HOLD
    blocked: HOLD
  result:
    payload: &id002
      status: ok
    receipt: $OUTPUT_ROOT/<task>/results/rNN_<run>/runtime.yaml
  cardinality: 1
  cells:
  - workspace_id: <workspace-id>
    mode: action
    owner_skill: haipipe-task-for-stata
    worker_skill_chain:
    - haipipe-task-for-stata
    interaction: execute declared Ticket
    authority_change: create
    source_projection: authoritative Result
  steps:
  - section: Setup
    label: setup:config
    required: true
    prompt: Load source selector, shared cohort config, per-run wrapper; set globals
    files_in:
    - scripts/config/_source_<SOURCE>.do
    - scripts/config/<COHORT>.do
    - scripts/config/rNN_<run>.do
    files_out: []
  - section: TriggerCases
    label: trigger:cases
    required: true
    prompt: Run trigger-cases scripts for <COHORT> on CMS year <YEAR> (<SOURCE>)
    files_in:
    - _WorkSpace/1-CMS-Store/<CMS_ASSET>/year-<YEAR>/
    files_out:
    - _WorkSpace/2-Case-Store/case_<COHORT>_<SOURCE>/<ASSET>/year-<YEAR>/CASES-<YEAR>.dta
  - section: BENE + enrollment
    label: feat:bene-year
    required: true
    prompt: Attach bene-year enrollment features from Bene_Info
    files_in: []
    files_out: []
  - section: BENE + enrollment
    label: feat:enrollment
    required: true
    prompt: Compute enrollment windows and Part D coverage
    files_in: []
    files_out: []
  - section: PDE chain
    label: feat:pde-chain
    required: true
    prompt: 'Run PDE chain: shared_pde -> pde_bene/pde_npi/pde_bn -> opioidrx'
    files_in:
    - _WorkSpace/0-External-Store/<NDC_GROUP>/
    files_out: []
  - section: Claims/Lines/Outpt chains
    label: feat:claims-chain
    required: true
    prompt: 'Run claims chain: shared_claims -> claims_bene/npi/bn'
    files_in: []
    files_out: []
  - section: Claims/Lines/Outpt chains
    label: feat:lines-chain
    required: true
    prompt: 'Run lines chain: shared_lines -> lines_bene/npi/bn'
    files_in: []
    files_out: []
  - section: Claims/Lines/Outpt chains
    label: feat:outpt-chain
    required: true
    prompt: 'Run outpt chain: shared_outpt -> outpt_bene/npi/bn'
    files_in: []
    files_out: []
  - section: Summary
    label: summary:counts
    required: true
    prompt: Count rows per panel, check feature coverage, write summary.txt
    files_in: []
    files_out:
    - $OUTPUT_ROOT/<task>/results/rNN_<run>/summary.txt
entry:
- execute
terminal:
- CLOSE
- HOLD
output:
  returns: *id002
  files_out:
  - _WorkSpace/2-Case-Store/case_<COHORT>_<SOURCE>/<ASSET>/year-<YEAR>/
  - $OUTPUT_ROOT/<task>/results/rNN_<run>/summary.txt
  - $OUTPUT_ROOT/<task>/results/rNN_<run>/log/
