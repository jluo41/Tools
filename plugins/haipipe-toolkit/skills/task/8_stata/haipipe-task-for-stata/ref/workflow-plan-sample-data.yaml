# Definition template: one independently executable config/Ticket variant.
# Expand variants as Run Specs only when independently commissioned.
# Resolve placeholders, catalogue key and every Workbench-owned Workspace Cell before use.
# Steps and section labels describe internal work; they never allocate Runs.
# Schema: task/haipipe-workflow/ref/plan-schema.md
name: data-<SPEC>
purpose: Assemble cross-year regression-ready analysis table for <SPEC>
input:
  args:
    config: scripts/config/rNN_<run>.do
  files_in: &id001
  - scripts/config/rNN_<run>.do
  - scripts/data_pipeline.do
  - scripts/config/<SPEC>.do
  - _WorkSpace/2-Case-Store/case_<COHORT>_<SOURCE>/<ASSET>/year-*/
  - _WorkSpace/0-External-Store/<PHYSICIAN_TRAITS>
owner: haipipe-task-for-stata
workbench:
  id: <owning-workbench>
  workspace_roster_ref: <workbench-definition>#workspace_roster
  workspace_ids:
  - <workspace-id>
run_specs:
- id: execute
  run_type: task.execute
  purpose: Assemble cross-year regression-ready analysis table for <SPEC>
  target: tasks/bNN_<block>/jNN_<job>/tNN_<task>
  actor:
    mode: automatic
    owner: haipipe-task-for-stata
  action: execute-ticket
  input: *id001
  entry_gate:
    mode: automatic
    assertion: config, inputs and current code review resolve
  exit_gate:
    mode: automatic
    assertion: all required Results pass the domain checks and runtime receipt is complete
  routes:
    pass: CLOSE
    fail: HOLD
    blocked: HOLD
  result:
    payload: &id002
      status: ok
    receipt: $OUTPUT_ROOT/<task>/results/rNN_<run>/runtime.yaml
  cardinality: 1
  cells:
  - workspace_id: <workspace-id>
    mode: action
    owner_skill: haipipe-task-for-stata
    worker_skill_chain:
    - haipipe-task-for-stata
    interaction: execute declared Ticket
    authority_change: create
    source_projection: authoritative Result
  steps:
  - section: Setup
    label: setup:config
    required: true
    prompt: Load config, resolve case-store and external-store paths
    files_in:
    - scripts/config/<SPEC>.do
    files_out: []
  - section: FilterCase
    label: filter-case:append-filter
    required: true
    prompt: Append per-year CASES from Case-Store, apply first-visit rule, age/year window, cancer exclusion
    files_in:
    - _WorkSpace/2-Case-Store/case_<COHORT>_<SOURCE>/<ASSET>/year-*/
    files_out: []
  - section: FilterExternal
    label: filter-external:merge-filter
    required: true
    prompt: Merge physician personality traits, apply MD/DO filter, review-count filter
    files_in:
    - _WorkSpace/0-External-Store/<PHYSICIAN_TRAITS>
    files_out: []
  - section: FullVariables
    label: full-variables:derive
    required: true
    prompt: Derive treatment/outcome/control variables, write ANALYSIS-CMS-Filter.dta
    files_in: []
    files_out:
    - _WorkSpace/<N>-Data-Store/<DATA_ASSET>/ANALYSIS-CMS-Filter.dta
  - section: Describe
    label: describe:summary
    required: true
    prompt: N rows, distinct benes/NPIs, year dist, treatment summary, outcome means, missingness
    files_in: []
    files_out:
    - $OUTPUT_ROOT/<task>/results/rNN_<run>/summary.txt
entry:
- execute
terminal:
- CLOSE
- HOLD
output:
  returns: *id002
  files_out:
  - _WorkSpace/<N>-Data-Store/<DATA_ASSET>/ANALYSIS-CMS-Filter.dta
  - $OUTPUT_ROOT/<task>/results/rNN_<run>/summary.txt
  - $OUTPUT_ROOT/<task>/results/rNN_<run>/log/
