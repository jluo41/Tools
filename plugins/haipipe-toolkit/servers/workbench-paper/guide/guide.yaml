# The Paper family's Guide (family `paper`): Guide › Description, Method, RoadMap Draw, Related Paper.
# Loaded by servers/workbench/guide_families.py (moved from its "paper" entry, 261007). Paths: guide/…
# related/… or a module are relative to servers/workbench-paper; skill:<name>/<rest> is a skill's file;
# Tools/… is SPACE-relative.
family: paper
label: Paper
presenter: paper.py
table: skill:workbench-paper/ref/workbench-table.md
papers_table: related/papers.md
# Guide › Method: the method file with its cards, then its methods canvas (JL 261003)
method_doc: guide/method.md
method_drawing: guide/methods.excalidraw
description: 'The Paper Workbench follows one paper from idea to submission on one Board. Ideation keeps
  the candidate ideas and which one was admitted; Story is the paper''s plan: its research questions, hypotheses
  and claims, the literature and study work that will support them, and the order the Sections tell it
  in; Sections shows every Section Page in that order with its draft, evidence and state; Delivery shows
  the assembled LaTeX and Word paper, its checks, the cover letter and each review round. It reads the
  paper''s Markdown on every open and stores nothing; each run is a prompt the person copies, and each
  gate is closed by the person.'
skills:
- skill: haipipe-paper-workflow
  role: Rules, routing and release gates
- skill: haipipe-paper-story
  role: Questions, claims and supporting evidence
- skill: workbench-paper
  role: Paper Spaces and their native sources
- skill: haipipe-paper-ideation
  role: Candidate ideas and admission
- skill: haipipe-paper-assemble
  role: Whole-paper delivery
- skill: haipipe-paper-comments
  role: Review rounds and responses
# the six steps of guide/method.md § 1 (the RoadMap drawing reads them; the method page shows them)
method:
- - Frame the question
  - Name the question worth asking and why it is not yet answered; a person admits it (G0).
- - Write the Story
  - The contribution, and one claim per question with its warrant.
- - Fix the evidence, then the work
  - Each question's evidence named before its Task work runs; a report answers it (G1, G2).
- - Write the Sections
  - Each Section Page tells part of the Story, in the reader's order (G3).
- - Deliver
  - Assemble the paper, check it, write the cover letter (G4).
- - Answer the rounds
  - Quote, answer and change the paper for every reviewer point (G5).
spaces:
- - Description
  - 'Scope · Venue · Resources · Related: the paper, its venues and the work it sits beside'
- - Idea Studio
  - the Story's RoadMap drawings and the Board's studio topics
- - Audience Report
  - 'Ideation · Narrative · High-level logic + Low-level work · Related Questions: the question, how the Story is told and whether it attracts its audience, and every question its audience asks'
- - Work Details
  - 'Jobs · Main · Appendix · Evidence: the versions (Jobs), then the Sections, each a Page'
- - Runs
  - the paper's run types
- - Delivery
  - 'LaTeX · Word · Cover letter · Rounds: the built paper, its checks and its review rounds'
folders:
- - Ideation
  - Paper ideation owner
  - A1-Story/Story00-ideation/
  - A1-Story/Story00-ideation
- - Story
  - Paper Story owner
  - A1-Story/Story<Letter>-<desk>-<idea>/
  - A1-Story/Story[!0]*
- - Sections
  - Section Page owners
  - Ba-<desk>-Main/ + Bb-<desk>-Appendix/
  - B[ab]-*
- - Delivery
  - Assemble / Round owners
  - delivery/ + Bc-<desk>-Round/
  - delivery
- - Story / RoadMap Draw
  - Story drawing owner
  - studio/<Story stem>.excalidraw
  - studio
- - Story / Report
  - Report Page owner
  - reports/qNN_<topic>/qNN_<topic>.md
  - reports/q[0-9][0-9]_*/*.md
# the ladder's folders (b16 g03, Q04), read beside today's above: the Story as studio topics and Questions,
# then one Job per version
- - Story topics (ladder)
  - Paper ideation and Story owners
  - studio/s01-ideation/ + studio/sNN-story-<desk>-<idea>/ · reports/qNN_<question>/
  - studio/s[0-9][0-9]-*
- - Version Job (ladder)
  - Section Page, comments and Assemble owners
  - jNN_v<N>_<desk>/ (its face, S-<desk>-Main-…/, S-<desk>-Appendix-…/, RD<NN>-…/ · CM<NN>-…/, delivery/)
  - j[0-9][0-9]_v*
boundary: Guide explains the Paper family. Story, Section Pages, delivery and supporting work keep their
  native owners. Run completion supplies evidence; it does not resolve a question.
# RoadMap Draw: the workbench design drawing, generated by its studio script in b16, view only.
# "only": the method page carries the steps as its first part, so Guide's list stays hidden
explain:
  method:
  - /_board/guide
  - family: paper
    mode: method
  - ''
  - only
  roadmap-draw:
  - /_excalidraw/
  - board: Tools/blueprints/b16_theme_paper/studio/s02-paper-workbench/paper-workbench-design.excalidraw
  - Workbench design
  - first
# The card Guide (b03 studio/s31-guide, s31-D05 to D08): the base's words are
# servers/workbench/guide/levels.yaml; here only the words a paper says differently (b16 Q01, s11-s13).
levels:
  Block:
    role: one paper, its question, its Story and the evidence each question needs
    spaces:
      Description:
        is: the paper's scope, the venues it writes for, what it uses and the related work
        reads: board.md · venues/<venue>/call.md · related/related.md (today the Story's Related Papers)
      Idea Studio:
        is: the Story's RoadMap drawings, then the Board's studio topics
        reads: studio/
      Audience Report:
        is: the candidate ideas, the Story's spine, and each research question with its work and report
        reads: board.md ## Questions · reports/qNN_<question>/ · studio/s01-ideation/ · studio/sNN-story-…/ (today A1-Story/)
      Work Details:
        is: the Sections, each a Page, and their Evidence; the Narrative is in the Audience Report
        reads: jNN_v<N>_<desk>/ (today Ba-<desk>-Main/ · Bb-<desk>-Appendix/)
      Runs:
        is: the paper's run types and the Runs of its Pages
        reads: haipipe-paper-workflow/ref/run-cards.md
      Delivery:
        is: the built paper (LaTeX, Word), the cover letter and the review rounds
        reads: jNN_v<N>_<desk>/delivery/ (today delivery/ · Bc-<desk>-Round/)
  Job:
    role: one version of the paper for one venue (jNN_v<N>_<desk>/), its Sections, its comments and its build;
      the Story Job (j00_story/) holds the Story every version tells
  Task:
    role: one Section, a Page, written by the Page method
roadmap:
  Block:
  - title: the paper ladder
    shows: every paper row, Block to Run, proposed above today
    board: Tools/blueprints/b16_theme_paper/studio/s01-paper-ladder/s01-paper-ladder.excalidraw
  - title: the Board's screens
    shows: the paper Board's tab, one frame per Space, and Guide › Method from it
    board: Tools/blueprints/b16_theme_paper/studio/s11-paper-block/s11-paper-block.excalidraw
  - title: the paper workbench before the frame
    shows: the old four-Space page, the old page the band links
    board: Tools/blueprints/b16_theme_paper/studio/s02-paper-workbench/paper-workbench-design.excalidraw
  Job:
  - title: a version's screens
    shows: a version's tab, one frame per Space (proposed)
    board: Tools/blueprints/b16_theme_paper/studio/s12-paper-job/s12-paper-job.excalidraw
  Task:
  - title: a Section's screens
    shows: a Section's tab, a Page Task with what the paper adds
    board: Tools/blueprints/b16_theme_paper/studio/s13-paper-task/s13-paper-task.excalidraw
