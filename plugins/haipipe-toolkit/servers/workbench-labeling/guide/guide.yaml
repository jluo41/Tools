description: 'The Labeling Workbench runs one subjective-labeling job on one Page: labels whose meaning
  a person must decide, such as how unsafe a reply is. Data prepares the corpus into items, holds a test
  set back unseen, and maps the items; Labeling is where the person confirms what each label means (G0),
  then labels rounds drawn from the corpus while the guideline is written down; Quality checks models
  against the person''s held-back answers; Delivery freezes the labels and hands them on. The person is
  the only source of gold: a model''s agreement never makes a label true. Every write goes through the
  job''s engine, which checks the person, the gate and the held-back test on each call.'
