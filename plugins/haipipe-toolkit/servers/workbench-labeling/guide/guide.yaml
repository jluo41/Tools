- skill: workbench-labeling
  role: The Page-local labeling job and its Spaces
- skill: haipipe-labeling-building
  role: 'Building the labels: meanings, rounds and guideline'
- skill: haipipe-labeling-scanning
  role: 'Scanning: the final test, production and audit'
method:
- - Prepare the corpus
  - Turn raw conversations into checked items grouped by source, and hold a test set back by group so
    no source sits on both sides.
- - Set up the job
  - The Contract names the target, the person who decides the labels, and the custodian of the held-back
    test.
- - Confirm the meanings
  - Discuss what each label means, then the person confirms them (G0); no round is drawn before.
- - Label in rounds
  - Each round draws items (round 1 at random), models may pre-label them blind, and the person gives
    each item its final label; the guideline is revised from the judgments.
- - Check against the held-back test
  - Models predict the locked test; a different agent scores them against the person's blind answers,
    by preregistered metrics.
- - Deliver
  - Freeze the handoff, label the corpus with the chosen model, send risky items back to the person, audit
    a sample, then release the final labels.
spaces:
- - Data
  - 'Preparation · Contract · Embedding: the corpus, the job''s contract, the map of items'
- - Labeling
  - 'Definition · Rounds · Guideline: what each label means, the rounds, the written guideline'
- - Quality
  - 'Test · Evaluation · Audit: the held-back test and the checks against it'
- - Delivery
  - 'Handoff · Scan · Final labels: what is frozen, scanned and released'
