<text x="738" y="187" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="738" dy="0">What is still unknown?</tspan><tspan x="738" dy="17.5">What evidence must be obtained?</tspan></text>
