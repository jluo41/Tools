<text x="24" y="47" font-family="Comic Sans MS, Arial, sans-serif" font-size="29" fill="#1e1e1e" text-anchor="start"><tspan x="24" dy="0">Methods · how a question reaches an answer</tspan></text>
<text x="24" y="80" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start"><tspan x="24" dy="0">Questions, reasoning, evidence, optional supporting work, interpretation and the issues that remain.</tspan></text>
