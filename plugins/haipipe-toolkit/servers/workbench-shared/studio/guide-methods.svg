<text x="38" y="376" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="38" dy="0">Record the unresolved issue</tspan><tspan x="38" dy="17.5">Revise the question or plan</tspan></text>
