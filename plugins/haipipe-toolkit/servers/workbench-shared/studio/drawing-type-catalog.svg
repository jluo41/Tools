<text x="40" y="1754" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start"><tspan x="40" dy="0">Guide and working types appear in successive sections. Each drawing opens under its own row and keeps its source owner.</tspan></text>
