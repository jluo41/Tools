<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project UI · proposed Theme views</title>
<style>

x 10px}.chain{display:block}.chain li{margin:8px 0;min-width:0}details>div{padding:0 14px 14px}.purpose{font-size:18px}h1 span{display:block;margin:6px 0 0}}
</style>
<main>
<header><p><a data-page="b10_project_workbench (removed 261126)">Project UI</a> / Project-Ladder</p><h1>Project-Ladder <span>Proposed UI</span></h1><nav role="tablist" aria-label="Project views"></nav><div class="mission"><b>Mission</b><p>Decide how every research Project is organized and how its workbench shows it, one Theme at a time, so the skills and the workbench follow one agreed plan.</p></div></header>
<section id="view" role="tabpanel" aria-label="Project"></section>
<section class="scope"><h2>🧭 Around the Work</h2><div id="around"></div></section>
</main>
<script>
const views=[{"id": "project", "label": "Project", "purpose": "Agree how Projects and their Themes are organized and presented.", "plan": ["Agree the Project boundary", "Develop each Theme’s pages", "Verify the shared frame and handoffs"], "blocks": [{"path": "examples/Project-Ladder/work", "label": "Work"}, {"path": "examples/Project-Ladder/discovery", "label": "Discovery"}, {"path": "examples/Project-Ladder/cowork", "label": "CoWork"}, {"path": "examples/Project-Ladder/insight", "label": "Insight"}, {"path": "examples/Project-Ladder/design", "label": "Design"}, {"path": "examples/Project-Ladder/labeling", "label": "Labeling"}, {"path": "examples/Project-Ladder/paper", "label": "Paper"}], "handoff": "Theme designs → Shared workbench → Project handover", "skills": [{"path": "plugins/haipipe-toolkit/skills/1_base/project/hai-project/SKILL.md", "label": "hai-project"}, {"path": "plugins/haipipe-toolkit/skills/1_base/workbench/hai-ui/SKILL.md", "label": "hai-ui"}, {"path": "plugins/haipipe-toolkit/skills/1_base/workbench/hai-workbench/SKILL.md", "label": "workbench"}]}, {"id": "work", "label": "Work", "purpose": "Develop the shared work frame and the Project ladder.", "plan": ["Define the Project boundary", "Align the shared frame", "Connect the Theme designs"], "blocks": [{"path": "b10_project_workbench (removed 261126)", "label": "b10 · Project workbench"}, {"path": "examples/Project-Ladder/blueprint/b17_theme_work", "label": "b17 · Work theme"}, {"path": "examples/Project-Ladder/work/b90_example_paper_results", "label": "b90 · Example results"}], "handoff": "Example estimates → Paper evidence", "skills": [{"path": "plugins/haipipe-toolkit/skills/2_work/work/hai-work/SKILL.md", "label": "hai-work"}, {"path": "plugins/haipipe-toolkit/skills/2_work/work/workbench-work/SKILL.md", "label": "workbench-work"}]}, {"id": "discovery", "label": "Discovery", "purpose": "Find and assess the external evidence a Project needs.", "plan": ["Frame the inquiry", "Read and assess sources", "Prepare the evidence handoff"], "blocks": [{"path": "examples/Project-Ladder/discovery/b01_example_discovery", "label": "b01 · Prior work"}], "handoff": "Evidence Bib → Paper citations", "skills": [{"path": "plugins/haipipe-toolkit/skills/2_work/discovery/hai-discovery/SKILL.md", "label": "hai-discovery"}, {"path": "plugins/haipipe-toolkit/skills/2_work/discovery/workbench-discovery/SKILL.md", "label": "workbench-discovery"}]}, {"id": "cowork", "label": "CoWork", "purpose": "Coordinate access, partners and the decisions that unblock work.", "plan": ["Identify the people and requests", "Resolve access and review requirements", "Record the handover"], "blocks": [{"path": "examples/Project-Ladder/cowork/b01_example_cowork", "label": "b01 · Data request"}], "handoff": "Access agreement → Work inputs", "skills": [{"path": "plugins/haipipe-toolkit/skills/2_work/cowork/hai-cowork/SKILL.md", "label": "hai-cowork"}, {"path": "plugins/haipipe-toolkit/skills/2_work/cowork/workbench-cowork/SKILL.md", "label": "workbench-cowork"}]}, {"id": "insight", "label": "Insight", "purpose": "Turn evidence into findings with a stated scope.", "plan": ["Define the questions", "Bind the evidence", "Review the interpretation"], "blocks": [{"path": "examples/Project-Ladder/insight/Insight-Example", "label": "Insight-Example"}], "handoff": "Reviewed interpretation → Paper or Design", "skills": [{"path": "plugins/haipipe-toolkit/skills/3_theme/insight/hai-insight/SKILL.md", "label": "hai-insight"}, {"path": "plugins/haipipe-toolkit/skills/3_theme/insight/workbench-insight/SKILL.md", "label": "workbench-insight"}]}, {"id": "design", "label": "Design", "purpose": "Develop and assess designs against an explicit goal.", "plan": ["Define the goal", "Choose a method and inputs", "Compare and review designs"], "blocks": [{"path": "examples/Project-Ladder/design/Design-Example", "label": "Design-Example"}], "handoff": "Reviewed designs → Project handover", "skills": [{"path": "plugins/haipipe-toolkit/skills/3_theme/design/hai-design/SKILL.md", "label": "hai-design"}, {"path": "plugins/haipipe-toolkit/skills/3_theme/design/workbench-design/SKILL.md", "label": "workbench-design"}]}, {"id": "labeling", "label": "Labeling", "purpose": "Define labels, check their quality and prepare a usable handoff.", "plan": ["Define the label and guideline", "Build and evaluate labels", "Prepare the handoff"], "blocks": [{"path": "examples/Project-Ladder/labeling/b02_labeling_walkthrough", "label": "b02 · Labeling walkthrough"}], "handoff": "Reviewed labels → Work dataset", "skills": [{"path": "plugins/haipipe-toolkit/skills/3_theme/labeling/hai-labeling/SKILL.md", "label": "hai-labeling"}, {"path": "plugins/haipipe-toolkit/skills/3_theme/labeling/workbench-labeling/SKILL.md", "label": "workbench-labeling"}]}, {"id": "paper", "label": "Paper", "purpose": "Connect the Project’s evidence to a paper and its readers.", "plan": ["Choose the question and claim", "Bind the evidence", "Develop the story and writing"], "blocks": [{"path": "examples/Project-Ladder/paper/Paper-Example", "label": "Paper-Example"}], "handoff": "Work estimates + Discovery citations → Paper evidence", "skills": [{"path": "plugins/haipipe-toolkit/skills/3_theme/paper/hai-paper/SKILL.md", "label": "hai-paper"}, {"path": "plugins/haipipe-toolkit/skills/3_theme/paper/workbench-paper/SKILL.md", "label": "workbench-paper"}]}];
const prefix=location.pathname.split('/examples/')[0].replace(/^\/|\/$/g,'');
const pathFor=p=>(prefix?prefix+'/':'')+p;
const pageURL=(p,section)=>'/_board/workbench?'+new URLSearchParams({path:pathFor(p),layout:'focus',...(section?{section}:{})});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(p,label)=>`<a href="${esc(pageURL(p))}" target="_blank" rel="noopener">${esc(label)}</a>`;
const section=(title,body)=>`<details><summary>${title}</summary><div>${body}</div></details>`;
const nav=document.querySelector('nav');
nav.innerHTML=views.map(v=>`<a role="tab" id="tab-${v.id}" aria-controls="view" href="#${v.id}">${v.label}</a>`).join('');
function draw(){
 const v=views.find(v=>v.id===location.hash.slice(1))||views[0];
 nav.querySelectorAll('a').forEach(a=>{const on=a.hash==='#'+v.id;a.setAttribute('aria-selected',String(on));a.tabIndex=on?0:-1});
 const body=document.querySelector('#view');body.setAttribute('aria-labelledby','tab-'+v.id);body.setAttribute('aria-label',v.label);
 body.innerHTML=section('1 · 🎯 Purpose',`<p class="purpose">${esc(v.purpose)}</p>`)
 +section('2 · 🧭 Plan',`<ol class="chain">${v.plan.map((s,i)=>`<li><span>Step ${i+1}</span>${esc(s)}</li>`).join('')}</ol><p class="note">Proposed sequence</p>`)
 +section('3 · '+(v.id==='project'?'🗂️ Themes':'🧱 Blocks'),`<ul class="blocks">${v.blocks.map(b=>`<li>${link(b.path,b.label)}</li>`).join('')}</ul>`)
 +section('4 · 🔗 Handoffs',`<p class="handoff">${esc(v.handoff)}</p><p class="note">Illustrative flow · exact artifact bindings remain to be specified.</p>`);
 const scope='examples/Project-Ladder'+(v.id==='project'?'':'/'+v.id);
 const contextBlocks=v.id==='project'?[{path:'b10_project_workbench (removed 261126)',label:'b10 · Project workbench'}]:v.blocks;
 const shared=[['🎨 Studio','studio'],['🙋 Interactions','interactions'],['⚖️ Decisions','decisions'],['📚 Things to Know','know'],['📝 Checklist','checklist'],['🕒 Timeline','timeline'],['🧰 Skills','skills'],['📂 Files','files']];
 document.querySelector('#around').innerHTML=shared.map(([name,id])=>section(name,id==='skills'?`<div class="skills">${v.skills.map(s=>`<a href="/${esc(pathFor(s.path))}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')}</div>`:(['decisions','checklist'].includes(id)?`<ul class="blocks">${contextBlocks.map(b=>`<li><a href="${esc(pageURL(b.path,id))}" target="_blank" rel="noopener">${esc(b.label)} · ${esc(name.replace(/^\S+\s/,''))}</a></li>`).join('')}</ul>`:`<a class="action" href="${esc(pageURL(scope,id))}" target="_blank" rel="noopener">Open ${esc(name.replace(/^\S+\s/,''))}</a>`))).join('');
}
nav.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const a=[...nav.querySelectorAll('a')];let i=a.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length;a[i].focus();location.hash=a[i].hash;});
window.addEventListener('hashchange',draw);document.querySelectorAll('[data-page]').forEach(a=>a.href=pageURL(a.dataset.page,'report')+'&group=ui-project');draw();
</script></html>
