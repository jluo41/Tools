<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>〈doc〉</title><style>:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--accent:#1f5fbf;--bg:#fff;--soft:#f4f4f2}
@media (prefers-color-scheme:dark){:root{--line:#3a3a37;--muted:#a3a39c;--ink:#ecece8;--accent:#8ab4ff;--bg:#1b1b19;--soft:#242422}}
body{margin:0;padding:14px 16px;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px}
h1{font-size:19px;margin:0 0 14px}h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-right:6px}
dl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;margin:0}
dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dd{margin:0}ol{margin:0;padding-left:20px}li{margin:3px 0}
code{font-size:13px;background:var(--soft);padding:0 4px;border-radius:4px;overflow-wrap:anywhere}
dd{overflow-wrap:anywhere}
@media (max-width:400px){body dl{grid-template-columns:minmax(0,1fr);gap:2px 0}body dt{padding-top:10px}body dt:first-child{padding-top:0}}ul{margin:0;padding-left:18px}a{color:var(--accent)}</style></head><body><h1><small>Job type ›</small>〈doc〉</h1><dl><dt>For</dt><dd>write what a person reads to use or release the tool.</dd><dt>Holds</dt><dd>Tasks whose Runs produce a document; a reader can follow it without the author.</dd><dt>Open</dt><dd>Read from the example Block; not yet agreed as a type of every Block of this kind.</dd><dt>In the example</dt><dd><ul><li><a target="_top" href="/_board/workbench?path=examples/Project-Ladder/work/b01_example_work/j02_first_docs&amp;layout=focus">j02_first_docs</a></li><li><a target="_top" href="/_board/workbench?path=examples/Project-Ladder/work/b01_example_work/j18_release&amp;layout=focus">j18_release</a></li></ul></dd></dl></body></html>
