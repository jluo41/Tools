<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icons</title>
<style>
:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b}
body{margin:0;background:#f4f4f2;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:760px;padding:16px;margin:0 auto}
.sec{max-width:760px;margin:18px auto 0;padding:0 16px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.card b{display:block;margin-bottom:10px}
.row{display:flex;justify-content:center;gap:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;color:var(--ink)}
.btn.on{background:var(--line)}.btn.off{color:#9a9a94}
.big{color:var(--ink);margin:6px 0 10px}
.bar{display:flex;align-items:center;gap:8px;background:#fafaf8;border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-top:10px;font-size:11px;color:var(--muted)}
.bar .t{border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.bar .sp{flex:1;text-align:left;white-space:nowrap;overflow:hidden}
</style></head><body><h2 class="sec">Metro map icon</h2><div class="grid" id="g"></div><h2 class="sec">Trace button icon</h2><div class="grid" id="g2"></div>
<script>
const I={
'A · Two lines, one stop':'<path d="M2 5.5h12M2 10.5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="5.5" r="2" fill="#fff" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="10.5" r="2" fill="#fff" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.5v1" stroke="currentColor" stroke-width="1.4"/>',
'B · Route with stops':'<path d="M2.5 12.5h4l3-9h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2.5" cy="12.5" r="1.8" fill="currentColor"/><circle cx="13.5" cy="3.5" r="1.8" fill="currentColor"/>',
'C · Three stations':'<path d="M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="3" cy="8" r="1.8" fill="currentColor"/><circle cx="8" cy="8" r="1.8" fill="#fff" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="8" r="1.8" fill="currentColor"/>',
'D · Branching line':'<path d="M2 12h4c2 0 2-8 5-8h3M6 12h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="4" r="1.6" fill="currentColor"/><circle cx="11" cy="12" r="1.6" fill="currentColor"/>',
'E · Columns of stops':'<path d="M4 2.5v11M8 2.5v11M12 2.5v11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".5"/><circle cx="4" cy="5" r="1.7" fill="currentColor"/><circle cx="8" cy="10" r="1.7" fill="currentColor"/><circle cx="12" cy="7" r="1.7" fill="currentColor"/>',
'F · History clock':'<circle cx="8.5" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 5v3.2l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M1.5 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
'G · Metro sign M':'<rect x="2" y="2" width="12" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 11V5.5l3 3.5 3-3.5V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
'H · Side panel':'<rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 2.5v11" stroke="currentColor" stroke-width="1.5"/><circle cx="11.8" cy="6" r="1" fill="currentColor"/><circle cx="11.8" cy="9.5" r="1" fill="currentColor"/>',
};
const g=document.getElementById('g');
for(const [k,p] of Object.entries(I)){const svg=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">${p}</svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="card"><b>${k}</b><div class="big">${svg(40)}</div><div class="row"><span class="btn on">${svg(16)}</span><span class="btn off">${svg(16)}</span></div><div class="bar"><span class="t">Trace</span><span class="sp">A sample plan: its files…</span><span class="btn on">${svg(16)}</span></div></div>`);}

const J={
'A · Footprints':'<path d="M5 2.5c1.3 0 2 1.4 2 3.2S6.3 9 5 9 3 7.5 3 5.7 3.7 2.5 5 2.5zM4 10.3h2.2v1.2a1.1 1.1 0 0 1-2.2 0zM11 5c1.3 0 2 1.4 2 3.2s-.7 3.3-2 3.3-2-1.5-2-3.3S9.7 5 11 5zM10 12.8h2.2v.5a1.1 1.1 0 0 1-2.2 0z" fill="currentColor"/>',
'B · Spotlight':'<path d="M3 3l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 5.2l2-2 2.6 2.6-2 2z" fill="currentColor"/><path d="M8.6 7.8L14 13H5.8z" fill="currentColor" opacity=".35"/>',
'C · Highlighter':'<path d="M9.5 2.5l4 4-6 6H3.5v-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 14h12" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round"/>',
'D · Focus target':'<circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
'E · Trail to a pin':'<path d="M2.5 13.5c2 0 2-3 4-3s2 1.5 3.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.6 1.8" stroke-linecap="round"/><path d="M12 2.5a2.8 2.8 0 0 1 2.8 2.8c0 2-2.8 4.6-2.8 4.6S9.2 7.3 9.2 5.3A2.8 2.8 0 0 1 12 2.5z" fill="currentColor"/><circle cx="12" cy="5.3" r="1" fill="#fff"/>',
'F · Lit file':'<path d="M4 1.8h5.5L12.5 5v9.2H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 8h4.5M6 10.5h3" stroke="#2f6fd6" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 1.8V5h3" fill="none" stroke="currentColor" stroke-width="1.4"/>',
'G · Eye':'<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/>',
'H · Word with a dot':'WORD',
};
const g2=document.getElementById('g2');
for(const [k,p] of Object.entries(J)){const svg=(s)=>p==='WORD'?`<span style="display:inline-flex;align-items:center;gap:5px;font-size:${s>20?18:12}px"><i style="width:${s>20?10:6}px;height:${s>20?10:6}px;border-radius:50%;background:#2f6fd6;display:inline-block"></i>Trace</span>`:`<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">${p}</svg>`;
 g2.insertAdjacentHTML('beforeend',`<div class="card"><b>${k}</b><div class="big">${svg(40)}</div><div class="row"><span class="btn on" style="${p==='WORD'?'width:auto;padding:0 8px;border-radius:999px;background:var(--ink);color:#fff':''}">${svg(16)}</span><span class="btn off" style="${p==='WORD'?'width:auto;padding:0 8px':''}">${svg(16)}</span></div><div class="bar"><span class="btn on" style="${p==='WORD'?'width:auto;padding:0 8px;border-radius:999px':''}">${svg(16)}</span><span class="sp">A sample plan: its files…</span></div></div>`);}
</script></body></html>
