<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro map</title>
<style>
:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--link:#1f5fbf}
body{margin:0;background:#f4f4f2;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.note{max-width:720px;margin:18px auto 0;color:var(--muted);font-size:12px}
.wrap{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin:10px auto}
.pane{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px 20px;display:flex;position:relative}
.pane{display:grid!important;grid-template-columns:auto auto;align-items:start}
.wrap{flex-wrap:wrap}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:0 0 6px}
#mode{border:0;background:none;border-radius:6px;padding:3px;line-height:0;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
#mode[aria-pressed=true]{background:var(--line)}
#pick{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.bar #metro{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:3px;border-radius:6px;line-height:0}.bar #metro[aria-pressed=true]{color:var(--ink);background:var(--line)}
.pane.nometro{grid-template-columns:auto}.pane.nometro #scroll{display:none}
.row.trace{cursor:pointer}
.tname{flex:1;min-width:0;border:0;background:none;padding:3px 6px;border-radius:6px;font:inherit;font-size:12.5px;font-weight:600;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tname:hover,.tname.on{background:var(--line)}
.aim{flex:1;max-width:none;font-size:12px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.dim{opacity:.3}
.fx-ghost .fn{color:#9a9a94;font-style:italic;animation:fade 2.6s ease-in-out infinite}.fx-ghost svg{opacity:.45}
.fx-ghost::before{content:"+";width:10px;margin-left:-12px;color:#9a9a94}
@keyframes fade{50%{opacity:.45}}
.fx-edit{background:linear-gradient(90deg,transparent,rgba(47,111,214,.12),transparent);background-size:200% 100%;animation:shine 2.4s ease-in-out infinite;border-radius:5px}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-50% 0}}
.fx-del .fn{text-decoration:line-through;opacity:.55}
.fx-plan .fn{border-bottom:1px dashed #cfcfca}.row.hit{font-weight:600}
.tree{flex:none;max-width:250px;min-width:0}.row{height:28px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.row.d{cursor:pointer}.row .tw{width:10px;font-size:10px;flex:none;color:var(--ink)}.row .fn{color:var(--link)}
.row.part{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row.ext{font-size:11px;color:var(--muted);letter-spacing:.06em}
.head{height:52px}.pane.nometro .head{display:none}
svg.map{flex:none;overflow:visible}
.scroll{overflow-x:auto;max-width:200px;flex:none;scrollbar-width:thin}
.day{font-size:10px;fill:var(--ink);font-weight:600}
.map text{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.map .t{cursor:pointer}.map .t.on text{fill:var(--ink);font-weight:700}
.map .st{cursor:pointer}
.map .live{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{50%{transform:scale(1.35)}}
.tcard{position:absolute;left:14px;right:14px;top:44px;z-index:20;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;
 box-shadow:0 14px 36px rgba(0,0,0,.16);padding:8px 12px;font-size:12px}
.tcard summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;font-size:13px;font-weight:600}
.tcard summary::-webkit-details-marker{display:none}.tcard summary::before{content:"▸";font-size:10px;color:var(--muted)}
.tcard details[open]>summary::before{content:"▾"}.tcard summary small{font-weight:400;color:var(--muted)}
.tcard summary a{margin-left:auto;font-weight:400;font-size:12px;color:#1f5fbf}
.tcard p{margin:6px 0}.tcard b.k{display:block;margin-top:8px;font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.tcard ul{margin:2px 0;padding-left:16px}.tcard li{margin:2px 0}.tcard .more{border:0;background:none;color:#1f5fbf;cursor:pointer;padding:0;font:inherit;font-size:11px}
.card h4{margin:0 0 4px;font-size:13px;display:flex;gap:6px;align-items:center}.card small{color:var(--muted)}
.card b.k{display:block;margin-top:8px;font-size:10.5px;color:var(--muted);letter-spacing:.05em}.card ul{margin:2px 0;padding-left:16px}
.sw{display:inline-block;width:12px;height:4px;border-radius:2px}
</style></head><body>

<div class="wrap"><div class="pane"><div class="bar"><button id="mode" aria-pressed="false" title="Trace" aria-label="Trace"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5l4 4-6 6H3.5v-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 14h12" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round"/></svg></button><button class="tname" id="tname" hidden></button><button id="metro" aria-pressed="true" title="Metro map" aria-label="Metro map"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12h4c2 0 2-8 5-8h3M6 12h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="4" r="1.6" fill="currentColor"/><circle cx="11" cy="12" r="1.6" fill="currentColor"/></svg></button></div><div class="tcard" id="card" hidden></div><div class="tree" id="tree"></div><div class="scroll" id="scroll"><svg class="map" id="map"></svg></div></div></div>
<script>
const IC={"py": "<svg class=\"file-icon\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" style=\"vertical-align:-2px\"><path fill=\"#3776AB\" d=\"M11.9 2C7 2 7.3 4.1 7.3 4.1v2.2h4.7v.7H5.4S2 6.6 2 11.9s3 5.1 3 5.1h1.8v-2.5s-.1-3 2.9-3h4.9s2.8 0 2.8-2.7V4.8S17.8 2 11.9 2zM9.2 3.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8z\"/><path fill=\"#FFD43B\" d=\"M12.1 22c4.9 0 4.6-2.1 4.6-2.1v-2.2H12v-.7h6.6S22 17.4 22 12.1s-3-5.1-3-5.1h-1.8v2.5s.1 3-2.9 3H9.4s-2.8 0-2.8 2.7v4S6.2 22 12.1 22zm2.7-1.6a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8z\"/></svg>", "md": "\ud83d\udcdd"};
const FOLDER='<svg width="17" height="14" viewBox="0 0 24 20" aria-hidden="true" style="flex:none"><path d="M2 5V3a1 1 0 0 1 1-1h6l2 3h10a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z" fill="#f8c44f" stroke="#996515" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const T=[
{k:'00',t:'09:10',d:'11-24',n:'sample 0',c:'#9b9b95',s:'done',aim:'A sample trace, to show how the map scrolls.',p:['09:10 earlier work'],f:{'side_pane/files_tree/work_files.py':'done','trace/1051':'done'}},
{k:'01',t:'10:02',d:'11-24',n:'sample 1',c:'#a0a09a',s:'done',aim:'A sample trace, to show how the map scrolls.',p:['10:02 earlier work'],f:{'side_pane/files_tree/work_files.py':'done','trace/1051':'done'}},
{k:'02',t:'13:40',d:'11-24',n:'sample 2',c:'#9b9b95',s:'done',aim:'A sample trace, to show how the map scrolls.',p:['13:40 earlier work'],f:{'side_pane/files_tree/work_files.py':'done','trace/1051':'done'}},
{k:'03',t:'16:15',d:'11-24',n:'sample 3',c:'#a0a09a',s:'done',aim:'A sample trace, to show how the map scrolls.',p:['16:15 earlier work'],f:{'side_pane/files_tree/work_files.py':'done','trace/1051':'done'}},
{k:'04',t:'17:30',d:'11-24',n:'sample 4',c:'#9b9b95',s:'done',aim:'A sample trace, to show how the map scrolls.',p:['17:30 earlier work'],f:{'side_pane/files_tree/work_files.py':'done','trace/1051':'done'}},
 {d:'11-25',k:'1051',t:'10:51',n:'trace view',c:'#8e6cc4',s:'done',aim:'A trace\'s files on the real tree, each with its state.',p:['10:51 for a trace, what is the plan?','11:06 please do it'],f:{'trace/1051':'done','side_pane/files_tree/trace_view.py':'done','side_pane/files_tree/file_icons.py':'done','side_pane/files_tree/work_files.py':'done'}},
 {k:'1110',t:'11:10',n:'folder icons rules',c:'#2a9d8f',s:'done',aim:'The icon and trace rules live in hai-ui\'s constitution.',p:['11:10 please continue'],f:{'trace/1110':'done','ui/CONSTITUTION.md':'done','ui/folder_icons_check.py':'done'}},
 {k:'1149',t:'11:49',n:'scope fade parts',c:'#e76f51',s:'done',aim:'Only the Block part fades.',p:['11:49 why they are faded?'],f:{'trace/1149':'done','side_pane/files_tree/focus_scope.py':'done'}},
 {k:'1418',t:'14:18',n:'trace timeline',c:'#2f6fd6',s:'edit',aim:'Many traces read as a timeline.',p:['14:18 this will be more and more','14:30 how could we flag this','14:31 before you draw it, give me the preview','14:33 make sure we have what we want'],chk:'Timeline widens to a grid of 26 files by 6 traces; a click on 15:30 opens its trace.',sum:'Many traces read as a timeline; later replaced by the metro map beside the tree.',f:{'trace/1418':'edit','side_pane/files_tree/trace_view.py':'edit','side_pane/files_tree/file_icons.py':'off','ui/CONSTITUTION.md':'edit'}},
 {k:'1505',t:'15:05',n:'tree marks',c:'#d4a017',s:'done',aim:'One tree; the traces mark their files on it.',p:['15:05 go ahead and do it','15:20 the card is still there'],f:{'trace/1505':'done','side_pane/files_tree/trace_view.py':'done','side_pane/files_tree/file_info.py':'done','side_pane/files_tree/work_files.py':'done','side_pane/files_tree/focus_scope.py':'done','ui/CONSTITUTION.md':'done'}},
 {k:'1512',t:'15:12',n:'files studio',c:'#43aa8b',s:'done',aim:'The Files pane has its own Studio topic.',p:['15:12 go ahead'],f:{'trace/1512':'done','s31/s31-files-pane.md':'done'}},
 {k:'1518',t:'15:18',n:'studio own snn',c:'#c0392b',s:'done',aim:'Studio lists the page\'s own sNN.',p:['15:16 could you just display these sNN?'],f:{'trace/1518':'done','page/block_index_page/focus_render.py':'done'}},
{d:'11-25',k:'1558',t:'15:58',n:'sample plan',c:'#6c757d',s:'plan',aim:'A sample plan: its files show before any work starts.',p:['15:58 make the plan first'],sum:'A sample plan: nothing changed yet; two files to create, one to delete.',f:{'trace/1558':'plan','side_pane/files_tree/file_info.py':'plan','page/file_card.py':'plan','page/old_switch.py':'delete','ui/CONSTITUTION.md':'plan'}},
];
const MISS={'trace/1558':1,'page/file_card.py':1};
const TREE=[
 {part:'1 · Block'},
 {d:'b17_theme_work',open:true,kids:[
   {d:'j01_work_ladder_contract',kids:[]},{d:'j03_work_workbench_pages',kids:[]},
   {d:'s31-files-pane',kids:[{f:'s31-files-pane.md',id:'s31/s31-files-pane.md',i:'md'}]},
   {d:'trace / 261125',open:true,kids:['1051','1110','1149','1418','1505','1512','1518','1558'].map(k=>({f:k+'_'+T.find(t=>t.k===k).n.replace(/ /g,'_')+'.md',id:'trace/'+k,i:'md'}))}]},
 {ext:1},{part:'↳ 2 · UI'},
 {d:'workbench / page',open:true,kids:['trace_view.py','file_info.py','file_card.py','file_icons.py','work_files.py','focus_scope.py','focus_render.py','old_switch.py'].map(n=>({f:n,id:'page/'+n,i:'py'}))},
 {part:'↳ 3 · Skills'},
 {d:'hai-ui',open:true,kids:[{f:'CONSTITUTION.md',id:'ui/CONSTITUTION.md',i:'md'},{f:'folder_icons_check.py',id:'ui/folder_icons_check.py',i:'py'}]},
];
const ROW=28,COL=24,TOP=52;let pick='1558';
function ids(n){return n.f?[n.id]:(n.kids||[]).flatMap(ids);}
function rows(){const out=[];(function walk(list,depth){for(const n of list){out.push({n,depth});if(n.d&&n.open)walk(n.kids,depth+1);}})(TREE,0);return out;}
function stateOf(t,n){const fs=ids(n);const order=['off','edit','delete','plan','done'];let best=null;for(const id of fs){const s=t.f[id];if(s&&(best===null||order.indexOf(s)<order.indexOf(best)))best=s;}return best;}
function station(x,y,s,c,big){
 if(s==='off')return `<path class="st" d="M${x} ${y-6}l6 6-6 6-6-6z" fill="#d98a12" stroke="#fff" stroke-width="1.5"/>`;
 if(s==='edit')return `<circle class="st live" cx="${x}" cy="${y}" r="6" fill="#fff" stroke="${c}" stroke-width="3"/>`;
 if(s==='delete')return `<g class="st"><circle cx="${x}" cy="${y}" r="5.5" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M${x-3} ${y-3}l6 6M${x+3} ${y-3}l-6 6" stroke="${c}" stroke-width="1.6"/></g>`;
 if(s==='plan')return `<circle class="st" cx="${x}" cy="${y}" r="5.5" fill="#fff" stroke="${c}" stroke-width="2" stroke-dasharray="2 2"/>`;
 return `<circle class="st" cx="${x}" cy="${y}" r="${big?6:5}" fill="${c}" stroke="#fff" stroke-width="2"/>`;}
let mode=false;
function fx(n){if(!n.f)return '';const t=T.find(t=>t.k===pick)||T[T.length-1];const st=t.f[n.id];if(!st)return '';
 if(MISS[n.id])return ' fx-ghost';if(st==='delete')return ' fx-del';if(st==='edit')return ' fx-edit';if(st==='off')return ' fx-off';return ' fx-plan';}
function hl(n){if(!mode)return '';const t=T.find(t=>t.k===pick);return ids(n).some(id=>t.f[id])?' hit':' dim';}
function draw(){
 const R=rows(),tree=document.getElementById('tree'),svg=document.getElementById('map');
 tree.innerHTML='<div class="head"></div>'+R.map(({n,depth},i)=>{
  if(n.part)return `<div class="row part">${n.part}</div>`;if(n.ext)return `<div class="row ext">┄ extends into ┄</div>`;
  if(n.d)return `<div class="row d${hl(n)}" data-i="${i}" style="padding-left:${depth*14}px"><span class="tw">${n.open?'▾':'▸'}</span>${FOLDER}<span>${n.d}</span></div>`;
  return `<div class="row${hl(n)}${fx(n)}${n.id.startsWith('trace/')?' trace':''}"${n.id.startsWith('trace/')?` data-k="${n.id.slice(6)}"`:''} style="padding-left:${depth*14+16}px" title="${n.id}">${IC[n.i]}<span class="fn">${n.f}</span></div>`;}).join('');
 const W=T.length*COL+10,H=TOP+R.length*ROW;svg.setAttribute('width',W);svg.setAttribute('height',H);
 let g='';
 T.forEach((t,c)=>{const x=10+c*COL;if(t.d&&(c===0||T[c-1].d!==t.d))g+=`<text class="day" x="${x-4}" y="9">${t.d}</text><line x1="${x-6}" x2="${x-6}" y1="0" y2="${H}" stroke="#e6e6e3"/>`;g+=`<g class="t${t.k===pick?' on':''}" data-k="${t.k}"><text x="${x}" y="${TOP-8}" transform="rotate(-60 ${x} ${TOP-8})">${t.t}</text></g>`;});
 // file lines: each row is a line running left to right through time, from its first trace to its last (and on to now)
 R.forEach(({n},i)=>{if(!n.f&&!n.d)return;const y=TOP+i*ROW+ROW/2;const cs=T.map((t,c)=>stateOf(t,n)?c:-1).filter(c=>c>=0);if(!cs.length)return;
  const live=cs.some(c=>stateOf(T[c],n)==='edit');const x1=10+cs[0]*COL,x2=live?10+(T.length-1)*COL+14:10+cs[cs.length-1]*COL;
  g+=`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${n.d?'#c9c9c3':'#3b3b38'}" stroke-width="${n.d?3:4}" stroke-linecap="round"/>`;
  if(live)g+=`<path d="M${x2} ${y-5}l7 5-7 5z" fill="#3b3b38"/>`;});
 // a trace ties its stations with a thin line in its colour
 T.forEach((t,c)=>{const x=10+c*COL;const ys=R.map(({n},i)=>(n.f||n.d)&&stateOf(t,n)?TOP+i*ROW+ROW/2:null).filter(v=>v!==null);
  if(ys.length>1)g+=`<line x1="${x}" x2="${x}" y1="${ys[0]}" y2="${ys[ys.length-1]}" stroke="${t.c}" stroke-width="${t.k===pick?2.5:1.5}" stroke-dasharray="${t.k===pick?'':'3 3'}" opacity="${t.k===pick?1:.6}"/>`;});
 // stations
 T.forEach((t,c)=>{const x=10+c*COL;R.forEach(({n},i)=>{if(!(n.f||n.d))return;const s=stateOf(t,n);if(!s)return;
  g+=`<g data-k="${t.k}">${station(x,TOP+i*ROW+ROW/2,s,t.c,n.d&&!n.open)}</g>`;});});
 svg.innerHTML=g;card();const t=T.find(t=>t.k===pick);}
let first=true;
let all=false;
let opened=false;
function card(){const el=document.getElementById('card'),nm=document.getElementById('tname'),t=T.find(t=>t.k===pick);
 nm.hidden=!mode||!t;if(t){nm.textContent=t.n;nm.title=(t.d||'11-25')+' '+t.t;}nm.classList.toggle('on',mode&&opened);
 el.hidden=!(mode&&opened&&t);if(el.hidden)return;const ps=all?t.p:t.p.slice(0,3);
 el.innerHTML=`<p>${t.aim}</p><b class="k">PROMPTS</b><ul>${ps.map(x=>`<li><b>${x.slice(0,5)}</b>${x.slice(5)}</li>`).join('')}</ul>${t.p.length>3&&!all?`<button class="more">${t.p.length-3} more</button>`:''}
 ${t.chk?`<b class="k">CHECK</b><p>${t.chk}</p>`:''}${t.sum?`<b class="k">SUMMARY</b><p>${t.sum}</p>`:''}`;
 const m=el.querySelector('.more');if(m)m.onclick=()=>{all=true;card();};}
document.getElementById('tname').onclick=e=>{e.stopPropagation();opened=!opened;card();};
document.addEventListener('click',e=>{const el=document.getElementById('card');if(opened&&!el.contains(e.target)){opened=false;card();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened){opened=false;card();}});
document.getElementById('tree').addEventListener('click',e=>{const tr=e.target.closest('.row[data-k]');if(tr){pick=tr.dataset.k;setMode(true);return;}const r=e.target.closest('.row.d');if(!r)return;const n=rows()[+r.dataset.i].n;n.open=!n.open;draw();});
document.getElementById('map').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(g){pick=g.dataset.k;setMode(true);}});
function reveal(){const t=T.find(t=>t.k===pick);if(!t)return;(function walk(list){for(const n of list){if(n.d&&ids(n).some(id=>t.f[id])){n.open=true;walk(n.kids);}}})(TREE);}
function setMode(v){mode=v;all=false;document.getElementById('mode').setAttribute('aria-pressed',mode);if(mode)reveal();draw();}   // on: open the folders down to its files
document.getElementById('mode').onclick=()=>setMode(!mode);
document.getElementById('metro').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);document.querySelector('.pane').classList.toggle('nometro',!on);};
draw();const sc=document.getElementById('scroll');sc.scrollLeft=sc.scrollWidth;
</script></body></html>
