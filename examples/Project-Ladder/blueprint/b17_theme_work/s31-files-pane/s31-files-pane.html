<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>s31 Files pane previews</title>
<style>
:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--accent:#1f5fbf;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--line:#3a3a37;--muted:#a3a39c;--ink:#ecece8;--accent:#8ab4ff;--bg:#1b1b19}}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
nav button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
nav .earlier{display:flex;align-items:center;gap:6px;margin-left:8px;font-size:11px;color:var(--muted);letter-spacing:.04em}
nav .earlier::before{content:"";width:1px;height:16px;background:var(--line)}
nav button.old{opacity:.5}nav button.old:hover,nav button.old[aria-pressed=true]{opacity:1}
nav a{margin-left:auto;font-size:12px;color:var(--accent);align-self:center}
iframe{display:block;width:100%;height:calc(100vh - 50px);border:0;background:#f4f4f2}
</style></head><body>
<nav aria-label="Previews">
 <button type="button" data-src="delivery/ui/files-metro-lr.html" aria-pressed="true">Metro map</button>
 <button type="button" data-src="delivery/ui/files-trace-effects.html" aria-pressed="false">Marks + card</button>
 <button type="button" data-src="delivery/ui/files-metro-icons.html" aria-pressed="false">Metro icon</button>
 <span class="earlier">Earlier</span>
 <button type="button" class="old" data-src="delivery/ui/files-metro.html" aria-pressed="false">Metro, by trace</button>
 <button type="button" class="old" data-src="delivery/ui/files-tree-timeline.html" aria-pressed="false">Tree + timeline</button>
 <button type="button" class="old" data-src="delivery/ui/files-trace-view.html" aria-pressed="false">First trace tree</button>
 <a id="open" href="delivery/ui/files-metro-lr.html" target="_blank" rel="noopener">Open ↗</a>
</nav>
<iframe id="view" title="Preview" src="delivery/ui/files-metro-lr.html"></iframe>
<script>
document.querySelector('nav').addEventListener('click', function (e) {
  var b = e.target.closest('[data-src]'); if (!b) return;
  document.querySelectorAll('[data-src]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  document.getElementById('view').src = b.dataset.src; document.getElementById('open').href = b.dataset.src;
});
</script>
</body></html>
