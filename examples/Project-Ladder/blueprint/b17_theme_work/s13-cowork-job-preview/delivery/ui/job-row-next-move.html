<style>
:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--bg:#f4f4f2;--paper:#fff;--accent:#1f5fbf;--warm:#b45309}

html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.chip.you{border-color:var(--warm);color:var(--warm)}
.kids{margin:0 0 10px 28px;padding:0 0 0 14px;border-left:2px solid var(--line)}.kids .row{padding:6px 10px}
.goal{background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.cols h2{margin-top:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 6px}
.down{text-align:center;color:var(--muted);margin:6px 0}
