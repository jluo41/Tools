<style>
:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--accent:#1f5fbf;--bg:#fff;--soft:#f4f4f2;--on:#eaf1fc}
@media (prefers-color-scheme:dark){:root{--line:#3a3a37;--muted:#a3a39c;--ink:#ecece8;--accent:#8ab4ff;--bg:#1b1b19;--soft:#242422;--on:#22304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:14px 20px 0;border-bottom:1px solid var(--line)}
header .crumb{font-size:12px;color:var(--muted)}
header h1{font-size:22px;margin:2px 0 10px}
.menu{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 -1px}
.menu span{padding:6px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.menu span.on{color:var(--accent);border-color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:minmax(240px,340px) 1fr;min-height:calc(100vh - 100px)}
.left{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 100px);padding:8px 0}
details{margin:0 0 4px}
summary{list-style:none;cursor:pointer;padding:6px 14px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);font-size:11px;width:10px}
details[open]>summary::before{content:"▾"}
summary a{color:inherit;text-decoration:none}summary a:hover{color:var(--accent)}
summary .miss{color:#c2410c;font-weight:400;font-size:12px}
.none>summary{color:var(--muted)}
.tr{display:flex;gap:6px;width:100%;border:0;background:none;text-align:left;padding:4px 14px 4px 30px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.tr:hover{background:var(--soft)}.tr.on{background:var(--on)}
.tr time{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tr b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{padding:18px 26px;max-width:860px}
.right h2{font-size:18px;margin:0 0 2px}
.right .when{color:var(--muted);font-size:12px;margin-bottom:10px}
.right .aim{font-size:15px;margin:0 0 14px}
.right h4{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.plan{list-style:none;padding:0;margin:0}.plan li{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.plan code{font-size:11px;color:var(--muted);min-width:42px}
.plan .p{font-family:ui-monospace,Menlo,monospace;font-size:12px;cursor:default}
.plan .w{color:var(--muted)}
ul.b{margin:0;padding-left:18px}ul.b li{margin:3px 0}
.file{margin-top:18px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
@media (max-width:720px){main{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line);max-height:45vh}.right{padding:14px 16px}}
