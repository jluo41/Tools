:root{--line:#e6e6e3;--muted:#6b6b66;--ink:#1d1d1b;--accent:#1f5fbf;--bg:#fff;--soft:#f4f4f2;--rail:#d6d6d1;--dark:#3b3b38}
@media (prefers-color-scheme:dark){:root{--line:#3a3a37;--muted:#a3a39c;--ink:#ecece8;--accent:#8ab4ff;--bg:#1b1b19;--soft:#242422;--rail:#4a4a46;--dark:#cfcfc8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.bar button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.bar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bar .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.bar .sp{flex:1}
.bar .z{border-radius:6px;padding:2px 8px}
.wrap{display:grid;grid-template-columns:240px 1fr;align-items:start}
body.read .wrap{grid-template-columns:240px 1fr 360px}
.names{position:relative;border-right:1px solid var(--line)}
.names div{position:absolute;left:0;right:0;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;display:flex;align-items:center;gap:6px}
.names .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.names .row::before{content:"";width:12px;height:10px;border-radius:2px;background:#f2c14e;flex:none}
.names .row.file::before{background:none;border:1px solid var(--muted);height:12px;width:10px}
.names .row.dim{opacity:.35}
.map{overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:thin}.map.drag{cursor:grabbing;user-select:none}
svg{display:block}
svg text{font-size:11px;fill:var(--muted)}svg text.day{font-weight:700;fill:var(--ink)}
.col{cursor:pointer}.col:hover text{fill:var(--accent)}.col.on text{fill:var(--accent);font-weight:700}
.card{border-left:1px solid var(--line);padding:14px 16px;position:sticky;top:46px;max-height:calc(100vh - 46px);overflow:auto;display:none}
body.read .card{display:block}
.pop{display:none;margin:0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.08);background:var(--bg);position:sticky;top:46px;z-index:4}
body:not(.read) .pop.show{display:block}
.card h3,.pop h3{margin:0 0 2px;font-size:15px}.when{color:var(--muted);font-size:12px;margin-bottom:6px}
.card h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.card ul{list-style:none;padding:0;margin:0}.card li{font-size:12.5px;margin:3px 0;overflow-wrap:anywhere}
.card li code{color:var(--muted);font-size:11px;margin-right:4px}
.card .pr li{list-style:disc;margin-left:16px}
.hint{color:var(--muted);font-size:12.5px}
@media (max-width:760px){.wrap,body.read .wrap{grid-template-columns:150px 1fr}body.read .card{grid-column:1/-1;position:static;border-left:0;border-top:1px solid var(--line)}}
