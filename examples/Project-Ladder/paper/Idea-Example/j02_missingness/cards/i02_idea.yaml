title: Missing-input robustness
question: Does masking inputs during training preserve prediction quality when deployment observations
  are missing?
claim: Training with a declared masking mechanism may reduce performance degradation under the same deployment
  missingness mechanism.
hypothesis: Training with a declared masking mechanism may reduce performance degradation under the same
  deployment missingness mechanism.
method: Declare missingness mechanisms; compare unmasked and masked training; evaluate on fixed incomplete
  test data.
minimum_experiment: A small controlled comparison across random and structured missingness, reporting
  degradation rather than claiming universal robustness.
expected_outcome: The declared comparison can support, narrow or reject the proposed effect; no result
  is asserted.
failure_interpretation: A null or reversed contrast rejects the claim within the tested boundary.
novelty_delta: Unverified; closest-work assessment is required.
