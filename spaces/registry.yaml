schema: jjluo-space-registry/v1
brand:
  display_name: JJ-LUO
  domain: jjluo.com
  note: DNS is lowercase; the brand is written as JJ-LUO.
  house_url: https://jjluo.com

workspace:
  root: ..
  root_relative_to: repository
  path_relative_to: workspace_root
  note: The four SPACE repositories are sibling directories of Tools-SPACE.

tailnet:
  hostname: jluo41s-mac-studio.tail582a01.ts.net
  address: 100.121.165.84
  access: tailnet-only
  app_protocol: http
  serve: disabled
  note: Direct port bindings are used until Tailscale Serve is enabled for this tailnet. Tailscale still encrypts the transport.

url_policy:
  space: http://{tailscale_host}:{space_port}
  board_home: http://{tailscale_host}:{space_port}/
  board: http://{tailscale_host}:{space_port}/b/{board}
  board_alias: ""
  board_alias_note: The live Board server already owns /b/{board}; do not create a second board registry.
  legacy_custom_domain: disabled

board_context:
  manifest: board.md
  discovery: walk-board-manifests-under-owning-space
  config_page: "{space_path}/.server_config/README.md"
  local_settings: "{space_path}/.server_config/settings.env"
  note: The manifest identifies a Board and its Pages; this registry identifies the owning SPACE. The local settings file is not a shared configuration page.

deployment:
  tunnel: none-for-space-services
  mode: direct-tailscale-bind
  access: tailscale-plus-basic-auth
  tailscale_host: jluo41s-mac-studio.tail582a01.ts.net
  tailscale_address: 100.121.165.84
  service_ports:
    cmsregboard: 5599
    physician: 5601
    welldoc: 5602
    reach: 5603
    drfirst: 5604
  note: Each service is rooted at one SPACE only. The four old Cloudflare routes are disabled.

statuses:
  - planned
  - active
  - review
  - paused
  - archived

spaces:
  - id: physician
    name: Physician-SPACE
    domain: physician.jjluo.com
    domain_status: disabled
    endpoint: http://jluo41s-mac-studio.tail582a01.ts.net:5601
    port: 5601
    path: Physician-SPACE
    mirror_path: Tools-SPACE/spaces/Physician-SPACE
    config_page: Physician-SPACE/.server_config/README.md
    status: active
    description: Physician review, clinical evaluation, and healthcare AI workflows.

  - id: welldoc
    name: WellDoc-SPACE
    domain: welldoc.jjluo.com
    domain_status: disabled
    endpoint: http://jluo41s-mac-studio.tail582a01.ts.net:5602
    port: 5602
    path: WellDoc-SPACE
    config_page: WellDoc-SPACE/.server_config/README.md
    status: active
    description: Continuous glucose monitoring, patient engagement, and healthcare AI workflows.

  - id: reach
    name: REACH-SPACE
    domain: reach.jjluo.com
    domain_status: disabled
    endpoint: http://jluo41s-mac-studio.tail582a01.ts.net:5603
    port: 5603
    path: REACH-SPACE
    config_page: REACH-SPACE/.server_config/README.md
    status: active
    description: REACH healthcare ML research, EHR data, and deployment workflows.

  - id: drfirst
    name: DrFirst-SPACE
    domain: drfirst.jjluo.com
    domain_status: disabled
    endpoint: http://jluo41s-mac-studio.tail582a01.ts.net:5604
    port: 5604
    path: DrFirst-SPACE
    config_page: DrFirst-SPACE/.server_config/README.md
    status: active
    description: DrFirst healthcare personalization, messaging, and ML workflows.
