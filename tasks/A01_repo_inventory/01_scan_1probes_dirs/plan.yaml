task: A01.01 scan_1probes_dirs
intent: Inventory every directory named `1-probes` in this repository and report, per hit, the owning folder and its PP-numbered entries.
input:
  repo_root: /Users/floydluo/Desktop/Tools-SPACE
  exclude: [.git, node_modules, .venv]
process:
  - walk repo_root for directories whose basename is exactly `1-probes`
  - for each hit, record the owning folder (the 1-probes parent) and every child entry matching PP<NN>_<slug>
output:
  results/scan/probes_dirs.json: machine-readable listing (one record per 1-probes directory)
