# The insight and design themes and what they stand on: their skills, the base skills they load, the agents an
# exported file names, the workbench host with its insight, design and work pages, the example folders the pages and
# tests read, and the installers. A target repository names this profile in its own export.yaml (export/README.md).

include:
  - install.sh
  - install.ps1
  - install-hooks.json
  - LICENSE
  - .gitignore
  - plugins/haipipe-toolkit/.claude-plugin
  - plugins/haipipe-toolkit/skills/README.md
  - plugins/haipipe-toolkit/skills/0_utils
  - plugins/haipipe-toolkit/skills/1_base/workbench
  - plugins/haipipe-toolkit/skills/1_base/project
  - plugins/haipipe-toolkit/skills/1_base/excalidraw
  - plugins/haipipe-toolkit/skills/1_base/draft          # the host imports its src/; insight's page check is its agent
  - plugins/haipipe-toolkit/skills/1_base/display
  - plugins/haipipe-toolkit/skills/1_base/evidence
  - plugins/haipipe-toolkit/skills/1_base/task           # the Task contract and every type family it routes to
  - plugins/haipipe-toolkit/skills/2_theme/insight
  - plugins/haipipe-toolkit/skills/2_theme/design
  - plugins/haipipe-toolkit/skills/2_theme/work           # its workbench serves a work Block, such as a data maker
  - plugins/haipipe-toolkit/skills/2_theme/discovery      # every Guide's "Add a paper" (Related Paper) is its run
  - plugins/haipipe-toolkit/skills/2_theme/labeling/workbench-labeling   # the screen manuals of the two servers the
  - plugins/haipipe-toolkit/skills/2_theme/paper/workbench-paper         # host imports to start (their Guide tables)
  - plugins/haipipe-toolkit/servers/README.md
  - plugins/haipipe-toolkit/servers/_host
  - plugins/haipipe-toolkit/servers/workbench
  - plugins/haipipe-toolkit/servers/workbench-insight
  - plugins/haipipe-toolkit/servers/workbench-design
  - plugins/haipipe-toolkit/servers/workbench-work
  - plugins/haipipe-toolkit/servers/workbench-labeling   # the host imports its mixin (live.labeling) to start
  - plugins/haipipe-toolkit/servers/workbench-paper      # the host imports its mixin (live.paper) to start
  - blueprints/Project-Ladder/insight
  - blueprints/Project-Ladder/design
  - blueprints/Project-Ladder/work/b11_theme_insight/board.md
  - blueprints/Project-Ladder/work/b11_theme_insight/goals
  - blueprints/Project-Ladder/work/b11_theme_insight/ui
  - blueprints/Project-Ladder/work/b12_theme_design/board.md
  - blueprints/Project-Ladder/work/b12_theme_design/goals
  - blueprints/Project-Ladder/work/b12_theme_design/ui
  - blueprints/Project-Ladder/work/b12_theme_design/s03-design-methods/parts/design-methods.excalidraw
  # the drawings the shipped Guides show (their guide.yaml `board:` lines)
  - blueprints/Project-Ladder/work/b10_project_workbench/s02-studio-workbench-skill/s02-studio-workbench-skill.excalidraw
  - blueprints/Project-Ladder/work/b10_project_workbench/s06-run-workbench-skill/s06-run-workbench-skill.excalidraw
  - blueprints/Project-Ladder/work/b11_theme_insight/s02-insight-workbench/insight-workbench-design.excalidraw
  - blueprints/Project-Ladder/work/b12_theme_design/s02-workbench-ui/design-workbench-ui.excalidraw
  - blueprints/Project-Ladder/work/b15_theme_labeling/s02-labeling-workbench/labeling-workbench-ui.excalidraw
  - blueprints/Project-Ladder/work/b16_theme_paper/s11-paper-block/s11-paper-block.excalidraw
  - blueprints/Project-Ladder/work/b16_theme_paper/s12-paper-job/s12-paper-job.excalidraw
  - blueprints/Project-Ladder/work/b16_theme_paper/s13-paper-task/s13-paper-task.excalidraw
  - blueprints/Project-Ladder/work/b17_theme_work/s01-work-ladder/s01-work-ladder.excalidraw
  - blueprints/Project-Ladder/work/b17_theme_work/s04-workbench-page-structure/result/merged-s03-work-workbench/task-workbench-design.excalidraw

# Only the agents an exported file names, from these folders.
agents_from:
  - plugins/haipipe-toolkit/agents

# A source file copied under another name.
map:
  AGENTS.md: docs/AGENTS-tools.md

exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.DS_Store"
  - "**/node_modules/**"
  - "**/.server_config/**"
  - "**/_old/**"
  - "**/_notes/**"                 # the source's development notes
  # the share door publishes a workbench beyond this machine; a target that leaves it out has none
  - plugins/haipipe-toolkit/skills/1_base/workbench/workbench/cli/wb_share.py
  - plugins/haipipe-toolkit/servers/_host/tests/test_share.py
  - plugins/haipipe-toolkit/servers/_host/live/share.py          # the host runs without it and never shares
  - plugins/haipipe-toolkit/skills/1_base/workbench/workbench/tests/test_wb_share.py
  # the source's development history (who asked, which other projects); a target carries the working skills
  - "**/CHANGELOG.md"
  # a vendored slide-deck tool (its own author and license); insight and design do not use it
  - plugins/haipipe-toolkit/skills/1_base/display/html-ppt/**
